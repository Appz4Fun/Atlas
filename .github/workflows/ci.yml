name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # installs the version pinned in rust-toolchain.toml (with rustfmt + clippy)
      - name: Install Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            nntp-xover-engine -> target

      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      # the overview engine is its own crate (like sealed-log), with its own lock file
      - run: cargo fmt --check
        working-directory: nntp-xover-engine
      - run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: nntp-xover-engine
      - run: cargo test --locked
        working-directory: nntp-xover-engine
