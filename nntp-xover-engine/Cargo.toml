[package]
name = "nntp-xover-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Columnar, mmap-able compressed storage for NNTP overview (XOVER/OVER) lines"
license = "GPL-3.0-only"
publish = false

[dependencies]
fsst = { package = "fsst-rs", version = "0.7" }
zstd = { version = "0.14", features = ["zdict_builder"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
memmap2 = "0.9"
tokio = { version = "1", features = ["io-util", "net", "rt", "macros"] }
anyhow = "1.0"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = "thin"

[[bin]]
name = "nxv-bench"
path = "src/main.rs"
