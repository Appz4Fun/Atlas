# `cargo run` keeps config.json, atlas.db and the logs in the repo root
# (same place the old python version kept them) instead of target/.
[env]
ATLAS_HOME = { value = ".", relative = true }

# bundled sqlite without the process wide locks it takes by default around
# every allocation (memory statistics), every page cache access (one shared
# cache group) and every page cache allocation and free past the first few
# pages (the overflow counters, STATIC_PMEM): with a writer per shard plus
# readers, threads queued on them. The local article store's readers start
# their caches over whenever another connection commits, and on prod its
# lookups spent a fifth of their time waiting on the overflow counter's lock.
LIBSQLITE3_FLAGS = "-USQLITE_ENABLE_MEMORY_MANAGEMENT -DSQLITE_DEFAULT_MEMSTATUS=0 -DSQLITE_DISABLE_PAGECACHE_OVERFLOW_STATS"

# Apple Silicon builds use every instruction the building Mac has (prod is an
# M5 and builds itself, so this is apple-m5 there). A binary built this way may
# not run on an older chip: build for the oldest Mac that will run it instead
# (RUSTFLAGS="-C target-cpu=apple-m1"), as the release workflow does. Linux,
# Windows and Docker builds are untouched. Per-function dispatch: docs/TODO.md.
[target.aarch64-apple-darwin]
rustflags = ["-C", "target-cpu=native"]
