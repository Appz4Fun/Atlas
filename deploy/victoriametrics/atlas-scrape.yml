# Add under scrape_configs in the VictoriaMetrics or Prometheus scrape config.
# Replace 192.168.1.172 with the machine Atlas runs on. The dashboards in
# deploy/grafana expect job "atlas" and the role labels below.
  - job_name: atlas
    static_configs:
      - targets: ['192.168.1.172:9092']
        labels:
          host: atlas
          role: indexer
      - targets: ['192.168.1.172:9093']
        labels:
          host: atlas
          role: api
  # The sealed log service (sealed-log/compose.yml), on the machine with the
  # big disk. deploy/grafana's "Atlas: Sealed log" dashboard expects job
  # "sealed-log". 127.0.0.1 works when VictoriaMetrics runs on that machine
  # with host networking; otherwise put the machine's address here.
  - job_name: sealed-log
    static_configs:
      - targets: ['127.0.0.1:7712']
        labels:
          host: sealed-log
