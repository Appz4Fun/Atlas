meta:
  version: 2
  date: '2026-11-02'
  scope: 'RAR4/RAR5, 7z, ZIP/ZIP64, PAR2, SFV, SRR, SRS, RAR .rev, raw split volumes: header fields, leaks, encryption, partial-decode feasibility'
  read_from_values:
  - first_article
  - last_article
  - first_and_last
  - separate_file
  - full
  verified_values:
  - VERIFIED
  - UNVERIFIED
  proves_values:
  - twin
  - alt
  - same_uploader
  - tool
  - none
  corrections:
  - '7z AES: IV per coder, no salt by default (IV is the per-archive key)'
  - RAR5 QO is per volume, not a set-wide file list
  - 'ZIP 0x9901 actual method is uint16 at +5 (libarchive reads 1 byte: bug)'
  - 'RAR4 EXTTIME remainder: 24-bit LE in 100 ns units'
  - 'REV5 signature is 8 bytes: Rar!1A Rev'
  - 'RAR5 -hp salt identical across volumes: rars writer only, WinRAR unverified'
  - RAR5 file encryption extra flag 0x02 is HASHMAC (CRC/hash replaced by HMAC), not TWEAKED
  - RAR5 dictionary mask 0x0f for RAR 5.0 compression version, wider for RAR7
  atlas_values:
  - stored
  - parsed
  - 'no'
  atlas_checked_against: local checkout ad111a0 (main was a29ee52; re-check before implementation)
formats:
  rar5:
    detect:
      magic: 52 61 72 21 1A 07 01 00
      offset: 0
      sfx: scan first ~1 MB for signature; offsets relative to signature
    structures:
      block_prefix:
      - name: hdr_crc
        where: '@hdr+0 uint32 LE; CRC32 of size..extra end'
        type: uint32
        read_from: first_article
        use: trust header parse on partial read
        proves: none
        leak: false
        status: VERIFIED
        source: w1a s1; w3c s1.1
        atlas: parsed
        atlas_where: archive/rar.rs:216-219 (listing checks CRC32, then used); probe/archive.rs:119 reads and skips
      - name: hdr_size
        where: '@hdr+4 vint; counts type..extra end (not CRC)'
        type: vint
        read_from: first_article
        use: next data at hdr+4+len(vint)+size
        proves: none
        leak: false
        status: VERIFIED
        source: w1a s1
        atlas: parsed
        atlas_where: archive/rar.rs:197-214; probe/archive.rs:121
      - name: hdr_type
        where: 'vint: 1 MAIN 2 FILE 3 SERVICE 4 CRYPT 5 ENDARC'
        type: vint
        read_from: first_article
        use: block dispatch
        proves: none
        leak: false
        status: VERIFIED
        source: w1a s1
        atlas: parsed
        atlas_where: archive/rar.rs:249-290 (dispatch only)
      - name: hdr_flags
        where: 'vint: 0x1 extra, 0x2 data, 0x4 skip-unknown, 0x8 split-before, 0x10 split-after, 0x20 child, 0x40 inherited'
        type: vint
        read_from: first_article
        use: split chain without names
        proves: none
        leak: false
        status: VERIFIED
        source: w1a s1; w3c s1.1
        atlas: parsed
        atlas_where: probe/archive.rs:125-126; archive/rar.rs:242-244; 0x10 SPLIT_AFTER -> continues (probe/archive.rs:138, serde-skip)
      - name: data_area_start
        where: 'derived: block+4+len(size vint)+hdr_size; not CRC-covered'
        type: derived
        read_from: first_article
        use: byte map of stored or packed data
        proves: none
        leak: false
        status: VERIFIED
        source: w1a s1, s16b
        atlas: parsed
        atlas_where: probe/archive.rs:160 -> stored_at (serde-skip, not persisted)
      main_header:
      - name: main_extra_size
        where: vint, present if hdr_flags 0x1
        type: vint
        read_from: first_article
        use: skip or parse main extras
        proves: none
        leak: false
        status: VERIFIED
        source: w1a s2
        atlas: 'no'
        atlas_where: probe handles no kind-1 block (probe/archive.rs:129-166); no kind-1 arm in archive/rar.rs:249-290
      - name: archive_flags
        where: 'vint: 0x1 VOLUME, 0x2 volume-number present, 0x4 SOLID, 0x8 RECOVERY, 0x10 LOCKED'
        type: vint
        read_from: first_article
        use: multi-volume, solid, RR presence
        proves: tool
        leak: true
        status: VERIFIED
        source: w1a s2; w3c s1.5
        atlas: 'no'
        atlas_where: main header (kind 1) not read in either path
      - name: volume_number
        where: vint, present if archive_flags 0x2 (absent in part 1)
        type: vint
        read_from: first_article
        use: exact part index; absence marks part 1
        proves: none
        leak: false
        status: VERIFIED
        source: w1a s2
        atlas: 'no'
        atlas_where: main header (kind 1) not read
      - name: locator_qlist_offset
        where: 'extra 0x01: flags 0x1, vint offset to QO from main header start (0 = absent)'
        type: vint
        read_from: first_article
        use: jump to QO cache (target at tail)
        proves: none
        leak: false
        status: VERIFIED
        source: w3c s1.5
        atlas: 'no'
        atlas_where: main header extra 0x01 not read
      - name: locator_rr_offset
        where: 'extra 0x01: flags 0x2, vint offset to RR block (0 = absent)'
        type: vint
        read_from: first_article
        use: jump to recovery block (target at tail)
        proves: none
        leak: false
        status: VERIFIED
        source: w3c s1.5
        atlas: 'no'
        atlas_where: main header extra 0x01 not read
      - name: main_archive_name_time
        where: 'extra 0x02: flags 0x1 orig name, 0x2 creation time, 0x4 unix, 0x8 ns'
        type: record
        read_from: first_article
        use: original archive name and creation time
        proves: same_uploader
        leak: true
        status: VERIFIED
        source: w1a s2
        atlas: 'no'
        atlas_where: main header extra 0x02 not read (Atlas gap table section 3.1)
      crypt_header:
      - name: crypt_version
        where: 'HEAD_CRYPT vint: 0 = AES-256'
        type: vint
        read_from: first_article
        use: headers encrypted; no listing without password
        proves: none
        leak: true
        status: VERIFIED
        source: w7b s1.1
        atlas: parsed
        atlas_where: archive/rar.rs:362 (_version discarded)
      - name: crypt_flags
        where: 'HEAD_CRYPT vint: 0x1 PSWCHECK present'
        type: vint
        read_from: first_article
        use: reject wrong password before decrypt
        proves: none
        leak: false
        status: VERIFIED
        source: w7b s1.1
        atlas: parsed
        atlas_where: archive/rar.rs:363-365 (gates the check value)
      - name: crypt_lg2_count
        where: '1 byte: KDF iterations = 2^N (default 15, max 24)'
        type: uint8
        read_from: first_article
        use: KDF cost; reveals -hp setting
        proves: tool
        leak: true
        status: VERIFIED
        source: w7b s1.1
        atlas: stored
        atlas_where: archive_release.password_check BLOB, PasswordCheck.kdf (archive/rar.rs:294-320; store.rs:72-73)
      - name: crypt_salt
        where: '16 bytes: archive-level header salt'
        type: bytes16
        read_from: first_article
        use: key derivation; grouping candidate
        proves: twin
        leak: true
        status: VERIFIED
        source: w7b s1.1
        atlas: stored
        atlas_where: same password_check BLOB, PasswordCheck.salt (archive/rar.rs:294-320; store.rs:72-73)
      - name: crypt_salt_same_across_volumes
        where: same HEAD_CRYPT salt in every volume of one set (rars writer)
        type: bytes16
        read_from: first_article
        use: group encrypted volumes without names
        proves: twin
        leak: true
        status: UNVERIFIED
        source: log W8A; WinRAR not checked
        atlas: 'no'
        atlas_where: no cross-volume comparison in Atlas
      - name: crypt_pswcheck_csum
        where: 8-byte PswCheck + 4-byte csum (first 4 bytes of SHA-256(PswCheck))
        type: bytes12
        read_from: first_article
        use: password test without decrypting
        proves: none
        leak: false
        status: VERIFIED
        source: w7b s1.1
        atlas: stored
        atlas_where: same password_check BLOB; csum verified at archive/rar.rs:372-373
      - name: crypt_pswcheck_algo
        where: 'PBKDF2-HMAC-SHA256 at 2^N+32 iterations (Key at 2^N, HashKey at 2^N+16); 32-byte output XOR-folded: PswCheck[i % 8] ^= out[i] (crypt5.cpp:161,179)'
        type: derived
        read_from: first_article
        use: password test algorithm
        proves: none
        leak: false
        status: VERIFIED
        source: w7b s1.3 (vectors only)
        check: 'Now verified in source: 2^N+32 iterations, XOR-fold of the 32-byte output into 8 bytes. Key uses 2^N and HashKey 2^N+16 (crypt5.cpp:84-85). Source crypt5.cpp:84-85,161,179.'
        atlas: 'no'
        atlas_where: PBKDF2 derivation not in Atlas copy; BLOB stores inputs only
      - name: encrypted_header_iv
        where: 16-byte IV before each later header (AES-256-CBC)
        type: bytes16
        read_from: first_article
        use: per-block IV; header lengths stay hidden
        proves: none
        leak: false
        status: VERIFIED
        source: w7b s1.2
        atlas: parsed
        atlas_where: archive/rar.rs:370 (used for file records; header IV not kept)
      - name: header_contents_hidden
        where: 'with -hp: names, sizes, header count, volume number, flags inside ciphertext'
        type: record
        read_from: first_article
        use: listing needs the key
        proves: none
        leak: false
        status: VERIFIED
        source: w7b s1.6
        atlas: stored
        atlas_where: archive_release.names_hidden (steps.rs:141-152; store.rs:70-73)
      file_header:
      - name: file_extra_size
        where: vint, present if hdr_flags 0x1
        type: vint
        read_from: first_article
        use: bounds extra records
        proves: none
        leak: false
        status: VERIFIED
        source: w1a s4
        atlas: parsed
        atlas_where: probe/archive.rs:125; archive/rar.rs:243
      - name: file_data_size
        where: vint, present if hdr_flags 0x2; packed bytes of this part
        type: vint
        read_from: first_article
        use: packed size; split files sum over volumes
        proves: none
        leak: false
        status: VERIFIED
        source: w1a s4
        atlas: stored
        atlas_where: ArchiveHead.packed (probe/archive.rs:136, probe only); listing skips (archive/rar.rs:244)
      - name: file_flags
        where: 'vint: 0x1 DIRECTORY, 0x2 UTIME, 0x4 CRC32 present, 0x8 unknown unpacked size'
        type: vint
        read_from: first_article
        use: dir vs file; CRC and size trust
        proves: none
        leak: false
        status: VERIFIED
        source: w3c s1.1
        atlas: parsed
        atlas_where: head_flags bit 0x04 -> encrypted (archive/rar.rs:104-107, stored); 0x02 -> continues (probe/archive.rs:85, serde-skip); 0x8000 used to skip (archive/rar.rs:65-71); other bits not read
      - name: file_unpacked_size
        where: vint, present unconditionally after file_flags (arcread.cpp:820). Ignore the value when file_flags 0x8 is set (arcread.cpp:822-824)
        type: vint
        read_from: first_article
        use: is the MKV complete
        proves: none
        leak: false
        status: VERIFIED
        source: w1a s4 (split parts unverified)
        check: Field is always present as a vint after file_flags, even when flag 0x8 is set. Source arcread.cpp:820-824.
        atlas: stored
        atlas_where: archive_inner_files.size (archive/rar.rs:284-285); ArchiveHead.unpacked (probe/archive.rs:140,152)
      - name: file_mtime_unix
        where: uint32 LE if UTIME flag; UTC Unix seconds
        type: uint32
        read_from: first_article
        use: UTC mtime; clock and zone leak
        proves: same_uploader
        leak: true
        status: VERIFIED
        source: w3c s1.1; w5c s1
        atlas: 'no'
        atlas_where: skipped by p += 4 (probe/archive.rs:143; archive/rar.rs:262-264)
      - name: file_crc32
        where: uint32 LE if CRC32 flag; unsplit or last part = unpacked CRC
        type: uint32
        read_from: first_article
        use: content fingerprint (not a key for first split parts)
        proves: twin
        leak: false
        status: VERIFIED
        source: w3c s1.1; w1a s4
        atlas: stored
        atlas_where: ArchiveHead.crc32 (probe/archive.rs:76, first file only); listing file4 never reads @16
      - name: comp_info
        where: 'comp_info (32-bit vint). 1-based bit numbers as used here: 1-6 (mask 0x3f) algorithm version; 7 (0x40) solid; 8-10 (0x380) method; 11-15 (0x7c00) dict exponent; 16-20 (0xf8000) dict fraction;
          21 (0x100000) FCI_RAR5_COMPAT (RAR7 compression flags)'
        type: vint
        read_from: first_article
        use: 'packer fingerprint: method, dict, version'
        proves: tool
        leak: true
        status: VERIFIED
        source: w1a s4; w3c s1.1
        check: 'Bit numbers are 1-based in the YAML while unrar uses 0-based FCI_* masks (headers5.hpp). Give explicit masks. "21 v1 flag" is FCI_RAR5_COMPAT (0x100000, RAR7 compression flags), not a version
          flag. Sources: headers5.hpp FCI_*; arcread.cpp:876.'
        atlas: parsed
        atlas_where: probe/archive.rs:149 (raw read; only the method is used)
      - name: comp_method
        where: 'comp_info bits 8-10: 0 = store (-m0), 1-5 compressed'
        type: derived
        read_from: first_article
        use: 'store: inner MKV readable with no decoder'
        proves: tool
        leak: true
        status: VERIFIED
        source: w1a s17
        atlas: stored
        atlas_where: ArchiveHead.method m0..m5 (probe/archive.rs:155-156); listing drops _compression (archive/rar.rs:268)
      - name: comp_dict_exponent
        where: comp_info bits 11-15 (mask 0x7c00 as 0-based bits 10-14). dict = 0x20000 << N (128 KiB << N). Mask is 0x0f when version==0 (RAR 5.0), 0x1f otherwise (arcread.cpp:876)
        type: derived
        read_from: first_article
        use: -md setting and packer default
        proves: tool
        leak: true
        status: VERIFIED
        source: w1a s4
        check: unrar masks the exponent with 0x0f when comp version is 0 (RAR 5.0) and 0x1f otherwise; prototype rar_meta.rs:883 always uses 0x1f. Source arcread.cpp:876.
        atlas: 'no'
        atlas_where: not read
      - name: comp_version
        where: 'comp_info bits 1-6: 0 = RAR 5.0, 1 = RAR 7.0+'
        type: derived
        read_from: first_article
        use: RAR 7.x packer detection
        proves: tool
        leak: true
        status: VERIFIED
        source: w1a s4; w3c s1.1
        atlas: 'no'
        atlas_where: not read (probe/archive.rs:149 uses only method)
      - name: file_host_os
        where: 'vint: 0 Windows, 1 Unix'
        type: vint
        read_from: first_article
        use: packer OS; decides attribute meaning
        proves: tool
        leak: true
        status: VERIFIED
        source: w3c s1.1; w8c i
        atlas: 'no'
        atlas_where: not read
      - name: file_attributes
        where: 'vint: Windows attrs (host 0) or POSIX st_mode (host 1)'
        type: vint
        read_from: first_article
        use: dir, symlink, uploader mode and umask
        proves: tool
        leak: true
        status: VERIFIED
        source: w1a s4
        atlas: parsed
        atlas_where: archive/rar.rs:261 (_attributes dropped); probe/archive.rs:141
      - name: file_name
        where: vint length + UTF-8, '/' separator; U+E080-E0FF + U+FFFE = non-portable Unix name
        type: utf8
        read_from: first_article
        use: file path; non-portable name flag
        proves: none
        leak: false
        status: VERIFIED
        source: w1a s4
        atlas: stored
        atlas_where: 'probe: ASCII half only (probe/archive.rs:79-83); listing name4/unicode4 (archive/rar.rs:115-173) -> archive_inner_files.name'
      extras:
      - name: extra_encryption
        where: 'file extra 0x01: vint version (0), vint flags (0x1 PSWCHECK present, 0x2 HASHMAC: unpacked-data CRC/BLAKE2 keyed by HashKey), uint8 KDF lg2 count, salt16, IV16, check12 (PswCheck8 + csum4)
          when 0x1. HashKey = PBKDF2 at 2^N+16 iterations (crypt5.cpp:161)'
        type: record
        read_from: first_article
        use: per-file encryption; TWEAKED makes CRC key-dependent
        proves: none
        leak: true
        status: VERIFIED
        source: w1a s5
        check: 'Flag 0x02 is named FHEXTRA_CRYPT_HASHMAC in unrar ("MAC for unpacked data checksums"), not TWEAKED. The HashKey is derived with 2^N+16 iterations. Sources: headers5.hpp FHEXTRA_CRYPT_*;
          arcread.cpp:1065-1107; crypt5.cpp:84-85,161.'
        atlas: stored
        atlas_where: file extra 0x01 check/kdf/salt -> password_check BLOB (archive/rar.rs:294-320, 296-304; store.rs:72-73); presence -> archive_release.encryption=2 (archive/rar.rs:277-282)
      - name: extra_hash_blake2sp
        where: 'file extra 0x02: hash_type 0 + 32-byte BLAKE2sp'
        type: record
        read_from: first_article
        use: content identity for unsplit files
        proves: twin
        leak: false
        status: VERIFIED
        source: w1a s5
        atlas: 'no'
        atlas_where: not read
      - name: extra_time_htime
        where: 'file extra 0x03: vint flags (0x1 unix time_t, 0x2 mtime, 0x4 ctime, 0x8 atime, 0x10 unix ns). Then per present time, in order mtime, ctime, atime: unix -> uint32 LE seconds; else uint64
          LE Windows FILETIME. Then, only if unix AND 0x10: one uint32 LE per present time, same order, value & 0x3fffffff (ignored if >= 1e9). Source arcread.cpp:1133-1163'
        type: record
        read_from: first_article
        use: ns timestamps; OS and clock fingerprint
        proves: tool
        leak: true
        status: VERIFIED
        source: w5c s1.6; w8c f
        check: 'YAML gives no layout. Value width depends on the unix flag; with unix+ns the ns words follow all seconds. Prototype rar_meta.rs:660 reads 8 bytes per time when unix+ns: wrong.'
        atlas: 'no'
        atlas_where: not read
      - name: extra_version
        where: 'file extra 0x04: flags, version number; name gets ;N'
        type: record
        read_from: first_article
        use: file versioning (rare)
        proves: none
        leak: false
        status: VERIFIED
        source: w1a s5
        atlas: 'no'
        atlas_where: not read
      - name: extra_redirection
        where: 'file extra 0x05: vint type (0 none, 1 unix symlink, 2 windows symlink, 3 junction, 4 hard link, 5 file copy); vint flags (0x1 target is dir); vint name length; UTF-8 target bytes. Source
          arcread.cpp:1177-1196'
        type: record
        read_from: first_article
        use: symlink target leaks packer paths; breaks largest-file rule
        proves: same_uploader
        leak: true
        status: VERIFIED
        source: w5c s4.1
        check: Missing the name-length vint between flags and the name. Source arcread.cpp:1177-1196 (prototype rar_meta.rs:678 has it right).
        atlas: 'no'
        atlas_where: not read (matters for largest-file rule)
      - name: extra_unix_owner
        where: 'file extra 0x06: vint flags (0x1 user name, 0x2 group name, 0x4 numeric uid, 0x8 numeric gid). If 0x1: vint len + user name. If 0x2: vint len + group name. If 0x4: vint uid. If 0x8: vint
          gid. Source arcread.cpp:1197-1230'
        type: record
        read_from: first_article
        use: Unix account and numeric ids of packer
        proves: same_uploader
        leak: true
        status: VERIFIED
        source: w5c s3.4
        check: 'Length prefixes missing and uid/gid shown as unconditional. Actual: names are length-prefixed vints, numeric ids present only by flag. Source arcread.cpp:1197-1230 (prototype rar_meta.rs:685
          matches source).'
        atlas: 'no'
        atlas_where: not read
      - name: extra_subdata
        where: 'file extra 0x07: service payload (RR percent vint, CMT text, QO cache)'
        type: bytes
        read_from: first_article or last_article
        use: service payload
        proves: tool
        leak: true
        status: VERIFIED
        source: w3c s1.4
        atlas: 'no'
        atlas_where: service extras not read; probe/archive.rs:174-185 tests type 1 only
      service_headers:
      - name: service_name
        where: 'service name: CMT, QO, ACL, STM, UOW, AV, RR, EA2'
        type: utf8
        read_from: first_article or last_article
        use: selects service decoder
        proves: none
        leak: false
        status: VERIFIED
        source: w3c s1.1
        atlas: 'no'
        atlas_where: service blocks skipped (probe/archive.rs:164-166; archive/rar.rs:258-288)
      - name: service_cmt
        where: 'CMT: archive comment in data area; method 0-5; CRC-checked; 16 MiB cap'
        type: text
        read_from: first_article if near main header, else full
        use: poster notes, group tags, URLs
        proves: same_uploader
        leak: true
        status: VERIFIED
        source: w3c s1.2
        atlas: 'no'
        atlas_where: not read
      - name: service_qo
        where: 'QO: raw cached headers; entries = CRC32, size vint, flags, backward offset, header bytes'
        type: record
        read_from: last_article
        use: file list without data; -qo leak
        proves: tool
        leak: true
        status: VERIFIED
        source: w3c s1.3
        atlas: 'no'
        atlas_where: not read
      - name: qo_scope_per_volume
        where: QO caches only its own volume's headers; normally at end of volume
        type: record
        read_from: last_article
        use: per-volume list, not set-wide
        proves: none
        leak: false
        status: VERIFIED
        source: log W4B correction
        atlas: 'no'
        atlas_where: not read
      - name: qo_entry_flags
        where: 'QO entry flags vint: bit meanings'
        type: vint
        read_from: last_article
        use: not needed for listing
        proves: none
        leak: false
        status: UNVERIFIED
        source: w3c s1.3
        atlas: 'no'
        atlas_where: not read
      - name: service_rr
        where: 'RR: recovery sectors in data area; found via locator RR offset'
        type: bytes
        read_from: last_article
        use: recovery presence (-rr) and size
        proves: tool
        leak: true
        status: VERIFIED
        source: w3c s1.4
        atlas: 'no'
        atlas_where: not read
      - name: rr_percent
        where: SUBDATA vint on RR block (1 byte before RAR 6.10)
        type: vint
        read_from: last_article
        use: -rr percentage
        proves: tool
        leak: true
        status: VERIFIED
        source: w8c d; w3c s1.4
        atlas: 'no'
        atlas_where: not read
      - name: rr_bytes_from_percent
        where: percent to recovery byte count
        type: derived
        read_from: last_article
        use: size of recovery data
        proves: tool
        leak: false
        status: UNVERIFIED
        source: w3c s1.4 (not in sources)
        atlas: 'no'
        atlas_where: not read
      - name: service_acl
        where: 'ACL: NTFS SECURITY_DESCRIPTOR (owner, group, DACL), compressed; written with -ow'
        type: record
        read_from: first_article
        use: owner SID = Windows account fingerprint
        proves: same_uploader
        leak: true
        status: VERIFIED
        source: w8c d; w5c s3.1
        atlas: 'no'
        atlas_where: not read
      - name: acl_owner_sid
