meta:
  version: 1
  date: '2026-11-02'
  scope: 'RAR4/RAR5, 7z, ZIP/ZIP64, PAR2, SFV, SRR, SRS, RAR .rev, raw split volumes: header fields, leaks, encryption, partial-decode feasibility'
  read_from_values:
  - first_article
  - last_article
  - first_and_last
  - separate_file
  - full
  verified_values:
  - VERIFIED
  - UNVERIFIED
  proves_values:
  - twin
  - alt
  - same_uploader
  - tool
  - none
  corrections:
  - '7z AES: IV per coder, no salt by default (IV is the per-archive key)'
  - RAR5 QO is per volume, not a set-wide file list
  - 'ZIP 0x9901 actual method is uint16 at +5 (libarchive reads 1 byte: bug)'
  - 'RAR4 EXTTIME remainder: 24-bit LE in 100 ns units'
  - 'REV5 signature is 8 bytes: Rar!1A Rev'
  - 'RAR5 -hp salt identical across volumes: rars writer only, WinRAR unverified'
formats:
  rar5:
    detect:
      magic: 52 61 72 21 1A 07 01 00
      offset: 0
      sfx: scan first ~1 MB for signature; offsets relative to signature
    structures:
      block_prefix:
      - name: hdr_crc
        where: '@hdr+0 uint32 LE; CRC32 of size..extra end'
        type: uint32
        read_from: first_article
        use: trust header parse on partial read
        proves: none
        leak: false
        status: VERIFIED
        source: w1a s1; w3c s1.1
      - name: hdr_size
        where: '@hdr+4 vint; counts type..extra end (not CRC)'
        type: vint
        read_from: first_article
        use: next data at hdr+4+len(vint)+size
        proves: none
        leak: false
        status: VERIFIED
        source: w1a s1
      - name: hdr_type
        where: 'vint: 1 MAIN 2 FILE 3 SERVICE 4 CRYPT 5 ENDARC'
        type: vint
        read_from: first_article
        use: block dispatch
        proves: none
        leak: false
        status: VERIFIED
        source: w1a s1
      - name: hdr_flags
        where: 'vint: 0x1 extra, 0x2 data, 0x4 skip-unknown, 0x8 split-before, 0x10 split-after, 0x20 child, 0x40 inherited'
        type: vint
        read_from: first_article
        use: split chain without names
        proves: none
        leak: false
        status: VERIFIED
        source: w1a s1; w3c s1.1
      - name: data_area_start
        where: 'derived: block+4+len(size vint)+hdr_size; not CRC-covered'
        type: derived
        read_from: first_article
        use: byte map of stored or packed data
        proves: none
        leak: false
        status: VERIFIED
        source: w1a s1, s16b
      main_header:
      - name: main_extra_size
        where: vint, present if hdr_flags 0x1
        type: vint
        read_from: first_article
        use: skip or parse main extras
        proves: none
        leak: false
        status: VERIFIED
        source: w1a s2
      - name: archive_flags
        where: 'vint: 0x1 VOLUME, 0x2 volume-number present, 0x4 SOLID, 0x8 RECOVERY, 0x10 LOCKED'
        type: vint
        read_from: first_article
        use: multi-volume, solid, RR presence
        proves: tool
        leak: true
        status: VERIFIED
        source: w1a s2; w3c s1.5
      - name: volume_number
        where: vint, present if archive_flags 0x2 (absent in part 1)
        type: vint
        read_from: first_article
        use: exact part index; absence marks part 1
        proves: none
        leak: false
        status: VERIFIED
        source: w1a s2
      - name: locator_qlist_offset
        where: 'extra 0x01: flags 0x1, vint offset to QO from main header start (0 = absent)'
        type: vint
        read_from: first_article
        use: jump to QO cache (target at tail)
        proves: none
        leak: false
        status: VERIFIED
        source: w3c s1.5
      - name: locator_rr_offset
        where: 'extra 0x01: flags 0x2, vint offset to RR block (0 = absent)'
        type: vint
        read_from: first_article
        use: jump to recovery block (target at tail)
        proves: none
        leak: false
        status: VERIFIED
        source: w3c s1.5
      - name: main_archive_name_time
        where: 'extra 0x02: flags 0x1 orig name, 0x2 creation time, 0x4 unix, 0x8 ns'
        type: record
        read_from: first_article
        use: original archive name and creation time
        proves: same_uploader
        leak: true
        status: VERIFIED
        source: w1a s2
      crypt_header:
      - name: crypt_version
        where: 'HEAD_CRYPT vint: 0 = AES-256'
        type: vint
        read_from: first_article
        use: headers encrypted; no listing without password
        proves: none
        leak: true
        status: VERIFIED
        source: w7b s1.1
      - name: crypt_flags
        where: 'HEAD_CRYPT vint: 0x1 PSWCHECK present'
        type: vint
        read_from: first_article
        use: reject wrong password before decrypt
        proves: none
        leak: false
        status: VERIFIED
        source: w7b s1.1
      - name: crypt_lg2_count
        where: '1 byte: KDF iterations = 2^N (default 15, max 24)'
        type: uint8
        read_from: first_article
        use: KDF cost; reveals -hp setting
        proves: tool
        leak: true
        status: VERIFIED
        source: w7b s1.1
      - name: crypt_salt
        where: '16 bytes: archive-level header salt'
        type: bytes16
        read_from: first_article
        use: key derivation; grouping candidate
        proves: twin
        leak: true
        status: VERIFIED
        source: w7b s1.1
      - name: crypt_salt_same_across_volumes
        where: same HEAD_CRYPT salt in every volume of one set (rars writer)
        type: bytes16
        read_from: first_article
        use: group encrypted volumes without names
        proves: twin
        leak: true
        status: UNVERIFIED
        source: log W8A; WinRAR not checked
      - name: crypt_pswcheck_csum
        where: 8-byte PswCheck + 4-byte csum (first 4 bytes of SHA-256(PswCheck))
        type: bytes12
        read_from: first_article
        use: password test without decrypting
        proves: none
        leak: false
        status: VERIFIED
        source: w7b s1.1
      - name: crypt_pswcheck_algo
        where: PBKDF2-HMAC-SHA256 at 2^N+32 iterations, XOR-folded to 8 bytes
        type: derived
        read_from: first_article
        use: password test algorithm
        proves: none
        leak: false
        status: UNVERIFIED
        source: w7b s1.3 (vectors only)
      - name: encrypted_header_iv
        where: 16-byte IV before each later header (AES-256-CBC)
        type: bytes16
        read_from: first_article
        use: per-block IV; header lengths stay hidden
        proves: none
        leak: false
        status: VERIFIED
        source: w7b s1.2
      - name: header_contents_hidden
        where: 'with -hp: names, sizes, header count, volume number, flags inside ciphertext'
        type: record
        read_from: first_article
        use: listing needs the key
        proves: none
        leak: false
        status: VERIFIED
        source: w7b s1.6
      file_header:
      - name: file_extra_size
        where: vint, present if hdr_flags 0x1
        type: vint
        read_from: first_article
        use: bounds extra records
        proves: none
        leak: false
        status: VERIFIED
        source: w1a s4
      - name: file_data_size
        where: vint, present if hdr_flags 0x2; packed bytes of this part
        type: vint
        read_from: first_article
        use: packed size; split files sum over volumes
        proves: none
        leak: false
        status: VERIFIED
        source: w1a s4
      - name: file_flags
        where: 'vint: 0x1 DIRECTORY, 0x2 UTIME, 0x4 CRC32 present, 0x8 unknown unpacked size'
        type: vint
        read_from: first_article
        use: dir vs file; CRC and size trust
        proves: none
        leak: false
        status: VERIFIED
        source: w3c s1.1
      - name: file_unpacked_size
        where: 'vint: full unpacked size (ignore if flag 0x8)'
        type: vint
        read_from: first_article
        use: is the MKV complete
        proves: none
        leak: false
        status: UNVERIFIED
        source: w1a s4 (split parts unverified)
      - name: file_mtime_unix
        where: uint32 LE if UTIME flag; UTC Unix seconds
        type: uint32
        read_from: first_article
        use: UTC mtime; clock and zone leak
        proves: same_uploader
        leak: true
        status: VERIFIED
        source: w3c s1.1; w5c s1
      - name: file_crc32
        where: uint32 LE if CRC32 flag; unsplit or last part = unpacked CRC
        type: uint32
        read_from: first_article
        use: content fingerprint (not a key for first split parts)
        proves: twin
        leak: false
        status: VERIFIED
        source: w3c s1.1; w1a s4
      - name: comp_info
        where: 'vint bits: 1-6 version, 7 solid, 8-10 method, 11-15 dict exp, 16-20 frac dict, 21 v1 flag'
        type: vint
        read_from: first_article
        use: 'packer fingerprint: method, dict, version'
        proves: tool
        leak: true
        status: VERIFIED
        source: w1a s4; w3c s1.1
      - name: comp_method
        where: 'comp_info bits 8-10: 0 = store (-m0), 1-5 compressed'
        type: derived
        read_from: first_article
        use: 'store: inner MKV readable with no decoder'
        proves: tool
        leak: true
        status: VERIFIED
        source: w1a s17
      - name: comp_dict_exponent
        where: 'comp_info bits 11-15: dict = 128 KiB << N'
        type: derived
        read_from: first_article
        use: -md setting and packer default
        proves: tool
        leak: true
        status: VERIFIED
        source: w1a s4
      - name: comp_version
        where: 'comp_info bits 1-6: 0 = RAR 5.0, 1 = RAR 7.0+'
        type: derived
        read_from: first_article
        use: RAR 7.x packer detection
        proves: tool
        leak: true
        status: VERIFIED
        source: w1a s4; w3c s1.1
      - name: file_host_os
        where: 'vint: 0 Windows, 1 Unix'
        type: vint
        read_from: first_article
        use: packer OS; decides attribute meaning
        proves: tool
        leak: true
        status: VERIFIED
        source: w3c s1.1; w8c i
      - name: file_attributes
        where: 'vint: Windows attrs (host 0) or POSIX st_mode (host 1)'
        type: vint
        read_from: first_article
        use: dir, symlink, uploader mode and umask
        proves: tool
        leak: true
        status: VERIFIED
        source: w1a s4
      - name: file_name
        where: vint length + UTF-8, '/' separator; U+E080-E0FF + U+FFFE = non-portable Unix name
        type: utf8
        read_from: first_article
        use: file path; non-portable name flag
        proves: none
        leak: false
        status: VERIFIED
        source: w1a s4
      extras:
      - name: extra_encryption
        where: 'file extra 0x01: version, flags (0x1 pswcheck, 0x2 TWEAKED), KDF count, salt16, IV16, check12'
        type: record
        read_from: first_article
        use: per-file encryption; TWEAKED makes CRC key-dependent
        proves: none
        leak: true
        status: VERIFIED
        source: w1a s5
      - name: extra_hash_blake2sp
        where: 'file extra 0x02: hash_type 0 + 32-byte BLAKE2sp'
        type: record
        read_from: first_article
        use: content identity for unsplit files
        proves: twin
        leak: false
        status: VERIFIED
        source: w1a s5
      - name: extra_time_htime
        where: 'file extra 0x03: flags (0x1 unix, 0x2 mtime, 0x4 ctime, 0x8 atime, 0x10 ns) + values'
        type: record
        read_from: first_article
        use: ns timestamps; OS and clock fingerprint
        proves: tool
        leak: true
        status: VERIFIED
        source: w5c s1.6; w8c f
      - name: extra_version
        where: 'file extra 0x04: flags, version number; name gets ;N'
        type: record
        read_from: first_article
        use: file versioning (rare)
        proves: none
        leak: false
        status: VERIFIED
        source: w1a s5
      - name: extra_redirection
        where: 'file extra 0x05: type (1 unix symlink, 2 win symlink, 3 junction, 4 hard, 5 copy), flags, target UTF-8'
        type: record
        read_from: first_article
        use: symlink target leaks packer paths; breaks largest-file rule
        proves: same_uploader
        leak: true
        status: VERIFIED
        source: w5c s4.1
      - name: extra_unix_owner
        where: 'file extra 0x06: flags, user name, group name, uid, gid'
        type: record
        read_from: first_article
        use: Unix account and numeric ids of packer
        proves: same_uploader
        leak: true
        status: VERIFIED
        source: w5c s3.4
      - name: extra_subdata
        where: 'file extra 0x07: service payload (RR percent vint, CMT text, QO cache)'
        type: bytes
        read_from: first_article or last_article
        use: service payload
        proves: tool
        leak: true
        status: VERIFIED
        source: w3c s1.4
      service_headers:
      - name: service_name
        where: 'service name: CMT, QO, ACL, STM, UOW, AV, RR, EA2'
        type: utf8
        read_from: first_article or last_article
        use: selects service decoder
        proves: none
        leak: false
        status: VERIFIED
        source: w3c s1.1
      - name: service_cmt
        where: 'CMT: archive comment in data area; method 0-5; CRC-checked; 16 MiB cap'
        type: text
        read_from: first_article if near main header, else full
        use: poster notes, group tags, URLs
        proves: same_uploader
        leak: true
        status: VERIFIED
        source: w3c s1.2
      - name: service_qo
        where: 'QO: raw cached headers; entries = CRC32, size vint, flags, backward offset, header bytes'
        type: record
        read_from: last_article
        use: file list without data; -qo leak
        proves: tool
        leak: true
        status: VERIFIED
        source: w3c s1.3
      - name: qo_scope_per_volume
        where: QO caches only its own volume's headers; normally at end of volume
        type: record
        read_from: last_article
        use: per-volume list, not set-wide
        proves: none
        leak: false
        status: VERIFIED
        source: log W4B correction
      - name: qo_entry_flags
        where: 'QO entry flags vint: bit meanings'
        type: vint
        read_from: last_article
        use: not needed for listing
        proves: none
        leak: false
        status: UNVERIFIED
        source: w3c s1.3
      - name: service_rr
        where: 'RR: recovery sectors in data area; found via locator RR offset'
        type: bytes
        read_from: last_article
        use: recovery presence (-rr) and size
        proves: tool
        leak: true
        status: VERIFIED
        source: w3c s1.4
      - name: rr_percent
        where: SUBDATA vint on RR block (1 byte before RAR 6.10)
        type: vint
        read_from: last_article
        use: -rr percentage
        proves: tool
        leak: true
        status: VERIFIED
        source: w8c d; w3c s1.4
      - name: rr_bytes_from_percent
        where: percent to recovery byte count
        type: derived
        read_from: last_article
        use: size of recovery data
        proves: tool
        leak: false
        status: UNVERIFIED
        source: w3c s1.4 (not in sources)
      - name: service_acl
        where: 'ACL: NTFS SECURITY_DESCRIPTOR (owner, group, DACL), compressed; written with -ow'
        type: record
        read_from: first_article
        use: owner SID = Windows account fingerprint
        proves: same_uploader
        leak: true
        status: VERIFIED
        source: w8c d; w5c s3.1
      - name: acl_owner_sid
        where: owner SID inside the ACL descriptor (S-1-5-21-...-RID)
        type: derived
        read_from: first_article
        use: same Windows account across posts
        proves: same_uploader
        leak: true
        status: UNVERIFIED
        source: w5c s3.1 (layout)
      - name: service_stm_zone
        where: STM ':Zone.Identifier' child service; name in SubData (UTF-8); body text
        type: record
        read_from: first_article
        use: mark-of-the-web; origin download host
        proves: alt
        leak: true
        status: VERIFIED
        source: w8c d; w5c s2.1
      - name: stm_zone_id
        where: ZoneId=0-4 in Zone.Identifier body (3 = Internet zone)
        type: text
        read_from: first_article
        use: download zone (value meaning unconfirmed)
        proves: none
        leak: true
        status: VERIFIED
        source: w5c s2.5
      - name: stm_host_url
        where: HostUrl / ReferrerUrl lines in Zone.Identifier (only when packed with -os)
        type: text
        read_from: first_article
        use: exact origin URL
        proves: alt
        leak: true
        status: UNVERIFIED
        source: w5c s2.4
      - name: service_uow_av_ea2
        where: UOW, AV, EA2 service names (layouts not read)
        type: record
        read_from: first_article
        use: Unix owner name; other service data
        proves: same_uploader
        leak: true
        status: UNVERIFIED
        source: w3c s1.7
      end_of_archive:
      - name: endarc_flags
        where: 'ENDARC vint: 0x1 = not last volume (next part exists)'
        type: vint
        read_from: last_article
        use: cheap next-part test
        proves: none
        leak: false
        status: VERIFIED
        source: w1a s6
      - name: endarc_trailer
        where: nothing read after ENDARC; appended data (signatures, tags) lives after it
        type: bytes
        read_from: last_article
        use: tail-append data from third-party tools
        proves: same_uploader
        leak: true
        status: VERIFIED
        source: w1a s6
    partial_decode:
      codec: RAR5 LZ (methods 1-5); store (method 0) needs no decoder
      crate: rars 0.12.3 codec::rar50 Unpack50Decoder
      result: about 1:1 prefix on truncated packed data (10% -> 786 KB); 64 KiB flush loss on last block
    rust:
      parse: hand-written (proto/rar_meta.rs)
      decode: rars 0.12.3 codec::rar50 direct
      crypto: pbkdf2+hmac+sha2
  rar4:
    detect:
      magic: 52 61 72 21 1A 07 00
      offset: 0
    structures:
      block_base:
      - name: head_crc
        where: '@hdr+0 uint16 LE; CRC16 of rest of block'
        type: uint16
        read_from: first_article
        use: header integrity
        proves: none
        leak: false
        status: VERIFIED
        source: w1a s8
      - name: head_type
        where: '@hdr+2 byte: 72 MARK 73 MAIN 74 FILE 75 CMT 76 AV 77 OLDSUB 78 PROTECT 79 SIGN 7A NEWSUB 7B ENDARC'
        type: uint8
        read_from: first_article
        use: block dispatch
        proves: none
        leak: false
        status: VERIFIED
        source: w1a s8; w5b s1
      - name: head_flags
        where: '@hdr+3 uint16; 0x8000 LONG_BLOCK, 0x4000 SKIP_IF_UNKNOWN'
        type: uint16
        read_from: first_article
        use: drives every flag test
        proves: none
        leak: false
        status: VERIFIED
        source: w1a s8
      - name: head_size
        where: '@hdr+5 uint16; total header length; data starts at block+HEAD_SIZE'
        type: uint16
        read_from: first_article
        use: locates data and next block
        proves: none
        leak: false
        status: VERIFIED
        source: w1a s8
      - name: add_size
        where: '@hdr+7 uint32 if LONG_BLOCK; packed size low 32 bits on FILE/NEWSUB'
        type: uint32
        read_from: first_article
        use: packed size
        proves: none
        leak: false
        status: VERIFIED
        source: w1a s8
      main_header:
      - name: main_reserved_av
        where: '@hdr+7 HighPosAV uint16 + PosAV uint32 (legacy)'
        type: uint16
        read_from: first_article
        use: ignore
        proves: none
        leak: false
        status: VERIFIED
        source: w1a s9
      - name: main_flags
        where: '@hdr+3: 0x1 VOLUME, 0x2 COMMENT, 0x4 LOCK, 0x8 SOLID, 0x10 NEWNUMBERING, 0x20 AV, 0x40 PROTECT, 0x80 PASSWORD (-hp), 0x100 FIRSTVOLUME, 0x200 ENCRYPTVER'
        type: uint16
        read_from: first_article
        use: solid, RR, -hp, naming (.partNN vs .rNN)
        proves: tool
        leak: true
        status: VERIFIED
        source: w5b s2
      - name: main_comment_inline
        where: 'MHD_COMMENT: old inline RAR 2.x comment after main header'
        type: record
        read_from: first_article
        use: legacy comment
        proves: same_uploader
        leak: true
        status: VERIFIED
        source: w3c s2.3
      file_header:
      - name: pack_size_low
        where: '@hdr+7 uint32 (= add_size on FILE)'
        type: uint32
        read_from: first_article
        use: packed size low 32 bits
        proves: none
        leak: false
        status: VERIFIED
        source: w1a s10
      - name: unp_size_low
        where: '@hdr+11 uint32; 0xFFFFFFFF = unknown'
        type: uint32
        read_from: first_article
        use: unpacked size low 32 bits
        proves: none
        leak: false
        status: VERIFIED
        source: w1a s10
      - name: file_host_os
        where: '@hdr+15 byte: 0 MSDOS 1 OS2 2 WIN32 3 UNIX 4 MACOS 5 BEOS'
        type: uint8
        read_from: first_article
        use: packer OS; attribute meaning
        proves: tool
        leak: true
        status: VERIFIED
        source: w8c i
      - name: file_crc32
        where: '@hdr+16 uint32: CRC32 of unpacked file'
        type: uint32
        read_from: first_article
        use: content fingerprint (unsplit)
        proves: twin
        leak: false
        status: VERIFIED
        source: w1a s10
      - name: dos_time
        where: '@hdr+20 uint32: time low (h<<11|m<<5|s/2), date high; local clock, 2 s'
        type: uint32
        read_from: first_article
        use: local clock, no zone
        proves: same_uploader
        leak: true
        status: VERIFIED
        source: w1a s10; w5c s1.1
      - name: unp_ver
        where: '@hdr+24 byte: 15, 20 or 29'
        type: uint8
        read_from: first_article
        use: minimum RAR version to extract
        proves: tool
        leak: true
        status: VERIFIED
        source: w1a s10
      - name: method
        where: '@hdr+25 byte: 0x30 store, 0x31-0x35 compressed'
        type: uint8
        read_from: first_article
        use: 'store: inner media readable'
        proves: tool
        leak: true
        status: VERIFIED
        source: w5b s2
      - name: name_size
        where: '@hdr+26 uint16'
        type: uint16
        read_from: first_article
        use: length of name field
        proves: none
        leak: false
        status: VERIFIED
        source: w1a s10
      - name: file_attr
        where: '@hdr+28 uint32: Windows attrs; host 3: high 16 bits = st_mode'
        type: uint32
        read_from: first_article
        use: dir, symlink (0xA000), Unix mode
        proves: tool
        leak: true
        status: VERIFIED
        source: w1a s10; w5c s6.2
      - name: high_sizes
        where: 'if LHD_LARGE: high pack uint32 @+32, then high unp uint32'
        type: uint32
        read_from: first_article
        use: 64-bit sizes over 4 GiB
        proves: none
        leak: false
        status: VERIFIED
        source: w1a s10
      - name: file_name
        where: 'name_size bytes: ASCII; with LHD_UNICODE an encoded stream after NUL; backslash separator'
        type: bytes
        read_from: first_article
        use: file path
        proves: none
        leak: false
