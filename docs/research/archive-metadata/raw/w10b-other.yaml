# Corrected fragment W10b: sections sevenz, zip, par2, sfv, srr, srs, split_raw.
# Generated from archive-field-catalog.yaml by verification pass W10b; the main session merges.
formats:
  sevenz:
    detect:
      magic: 37 7A BC AF 27 1C
      offset: 0
    structures:
      start_header:
      - name: signature
        where: 'bytes 0-5: 37 7A BC AF 27 1C'
        type: bytes6
        read_from: first_article
        use: format detection; SFX search key
        proves: none
        leak: false
        status: VERIFIED
        source: w1b s2
        atlas: stored
        atlas_where: probe/archive.rs:36-37 (format "7z")
      - name: version
        where: byte 6 major (0; reader checks), byte 7 minor (0x04 = 7-Zip 9.x+ writer)
        type: uint8
        read_from: first_article
        use: writer hint
        proves: tool
        leak: true
        status: VERIFIED
        source: w1b s2
        atlas: parsed
        atlas_where: sevenz.rs:37 (major checked == 0; minor not read)
      - name: start_header_crc
        where: '@8 uint32 CRC32 over bytes 12-31'
        type: uint32
        read_from: first_article
        use: validates start header from article 1
        proves: none
        leak: false
        status: VERIFIED
        source: w1b s2
        atlas: parsed
        atlas_where: sevenz.rs:40 (checked, dropped)
      - name: next_header_offset
        where: '@12 uint64 LE; relative to byte 32 (absolute = 32 + value)'
        type: uint64
        read_from: first_article
        use: points at tail header (last article)
        proves: none
        leak: false
        status: VERIFIED
        source: w1b s2
        atlas: parsed
        atlas_where: sevenz.rs:43, 472-479 (Start.offset, dropped)
      - name: next_header_size
        where: '@20 uint64 LE; length of next-header block'
        type: uint64
        read_from: first_article
        use: exact tail fetch length
        proves: none
        leak: false
        status: VERIFIED
        source: w1b s2
        atlas: parsed
        atlas_where: sevenz.rs:Start.size (dropped)
      - name: next_header_crc
        where: '@28 uint32 CRC32 of next-header block'
        type: uint32
        read_from: first_article
        use: verify tail fetch; fingerprint
        proves: none
        leak: false
        status: VERIFIED
        source: w1b s2
        atlas: parsed
        atlas_where: sevenz.rs:487 (Start.crc checked against header)
      - name: start_header_zeroed_recovery
        where: 'zeroed start header: reader scans last 512 bytes for header markers'
        type: derived
        read_from: last_article
        use: recover damaged posts
        proves: none
        leak: false
        status: UNVERIFIED
        source: w1b s2 (partial)
        atlas: 'no'
        atlas_where: not implemented (w9a section 4.1 lists no recovery path)
      - name: sfx_signature_search
        where: signature at non-zero offset with valid start CRC = SFX or prefixed
        type: derived
        read_from: first_article
        use: prefixed or obfuscated posts
        proves: none
        leak: false
        status: UNVERIFIED
        source: w1b s2 (partial)
        atlas: 'no'
        atlas_where: not implemented; SFX RAR scan is only in prototype rar_meta.rs:219
      next_header:
      - name: next_header_first_byte
        where: 0x01 kHeader (plain) or 0x17 kEncodedHeader
        type: uint8
        read_from: last_article
        use: plain or packed header branch
        proves: none
        leak: false
        status: VERIFIED
        source: w1b s3
        atlas: parsed
        atlas_where: sevenz.rs:500-504 (nested)
      - name: encoded_header_streams
        where: 'kEncodedHeader: one-folder StreamsInfo; decoded output must start 0x01'
        type: record
        read_from: last_article
        use: header decode pipeline
        proves: none
        leak: false
        status: VERIFIED
        source: w1b s3
        atlas: parsed
        atlas_where: sevenz.rs:513-535 (LZMA id 030101 only)
      - name: encoded_header_plain_aes
        where: 'with -mhe=on: AES coder 06F10701 and its props visible in plaintext'
        type: record
        read_from: last_article
        use: encrypted-header archive without password
        proves: tool
        leak: true
        status: VERIFIED
        source: w1b s3; w7b s3.5
        atlas: stored
        atlas_where: archive_release.names_hidden / encryption=3 (steps.rs:142-152 via headers_encrypted)
      - name: encoded_header_folder_crc
        where: CRC32 of decoded header (folder digest)
        type: uint32
        read_from: last_article
        use: per-archive key across reposts
        proves: twin
        leak: false
        status: VERIFIED
        source: w1b s10
        atlas: parsed
        atlas_where: sevenz.rs:534-536 (folder CRC used to verify header; dropped)
      streams_info:
      - name: pack_pos
        where: 'kPackInfo PackPos: first packed stream offset, relative to byte 32'
        type: uint64
        read_from: last_article
        use: absolute packed data position
        proves: none
        leak: false
        status: VERIFIED
        source: w1b s5.3
        atlas: parsed
        atlas_where: sevenz.rs:207-230 (used for decode, dropped)
      - name: pack_sizes
        where: kSize per packed stream
        type: uint64
        read_from: last_article
        use: byte range per folder input -> articles
        proves: none
        leak: false
        status: VERIFIED
        source: w1b s5.3
        atlas: parsed
        atlas_where: sevenz.rs:207-230 (used for decode, dropped)
      - name: pack_crcs
        where: kCRC Digests of packed streams
        type: uint32
        read_from: last_article
        use: integrity only with the full stream
        proves: twin
        leak: false
        status: VERIFIED
        source: w1b s5.3
        atlas: parsed
        atlas_where: sevenz.rs:224 (r.digests(count)? return dropped)
      - name: folder_list
        where: 'kFolder: NumFolders; External byte must be 0'
        type: record
        read_from: last_article
        use: coder graph per folder
        proves: none
        leak: false
        status: VERIFIED
        source: w1b s5.4
        atlas: parsed
        atlas_where: sevenz.rs:126, 184 (Folder.coders; used only for AES/LZMA checks; not persisted)
      - name: coder_flags_and_id
        where: coder flags byte (id size, complex, props bit) + method id bytes
        type: record
        read_from: last_article
        use: decode pipeline
        proves: tool
        leak: true
        status: VERIFIED
        source: w1b s5.5
        atlas: parsed
        atlas_where: sevenz.rs:126, 181-183, 513 (ids used; method chain not kept)
      - name: bind_pairs_packed_streams
        where: NumBindPairs = out-1; packed stream indices
        type: record
        read_from: last_article
        use: coder chain wiring
        proves: none
        leak: false
        status: VERIFIED
        source: w1b s5.5
        atlas: parsed
        atlas_where: sevenz.rs:191-201 (dropped)
      - name: coders_unpack_size
        where: kCodersUnPackSize per coder output
        type: uint64
        read_from: last_article
        use: unpacked size of each coder output
        proves: none
        leak: false
        status: VERIFIED
        source: w1b s5.4
        atlas: parsed
        atlas_where: sevenz.rs:245-249 -> Folder::size (sevenz.rs:135-139)
      - name: folder_crc
        where: kCRC of each folder final output
        type: uint32
        read_from: last_article
        use: folder integrity; twin key
        proves: twin
        leak: false
        status: VERIFIED
        source: w1b s5.4
        atlas: parsed
        atlas_where: sevenz.rs:254-257 (Folder.crc; only used for header verify)
      - name: substream_counts
        where: kNumUnPackStream per folder (files in solid block)
        type: uint64
        read_from: last_article
        use: files per solid block
        proves: none
        leak: false
        status: VERIFIED
        source: w1b s5.6
        atlas: parsed
        atlas_where: sevenz.rs:267-274 (per_folder; dropped)
      - name: substream_sizes
        where: 'kSize: N-1 sizes per folder; last = folder size minus sum'
        type: uint64
        read_from: last_article
        use: per-file offsets in folder
        proves: none
        leak: false
        status: VERIFIED
        source: w1b s5.6
        atlas: stored
        atlas_where: sevenz.rs:279-292 -> Streams.sizes -> archive_inner_files.size
      - name: substream_crcs
        where: per-file CRC32 (single-substream folder inherits folder CRC)
        type: uint32
        read_from: last_article
        use: per-file CRC (needs full file)
        proves: twin
        leak: false
        status: VERIFIED
        source: w1b s5.6
        atlas: parsed
        atlas_where: 'sevenz.rs:299-304 (digests read and discarded: free per-file CRC32 lost)'
      - name: file_order_in_header
        where: dirs, then empty files, then data files in add order; no type sort by default
        type: derived
        read_from: last_article
        use: which files sit in solid block 1
        proves: none
        leak: false
        status: VERIFIED
        source: log W4B (7zHandlerOut)
        atlas: 'no'
        atlas_where: 'no solid-block ordering stored (w9a section 4: per-folder counts parsed, no solid flag)'
      files_info:
      - name: files_num
        where: 'NUMBER: NumFiles'
        type: uint64
        read_from: last_article
        use: file count
        proves: none
        leak: false
        status: VERIFIED
        source: w1b s5.7
        atlas: parsed
        atlas_where: sevenz.rs:350-389 (entry list; count not stored separately)
      - name: empty_stream
        where: 'kEmptyStream bitfield: no data stream (dir or empty file)'
        type: bitfield
        read_from: last_article
        use: separates dirs and empty entries
        proves: none
        leak: false
        status: VERIFIED
        source: w1b s5.7
        atlas: parsed
        atlas_where: sevenz.rs:350, 369 (dropped after use)
      - name: empty_file
        where: 'kEmptyFile bitfield over empty-stream entries: empty file vs dir'
        type: bitfield
        read_from: last_article
        use: directory vs empty file
        proves: none
        leak: false
        status: VERIFIED
        source: w1b s5.7
        atlas: parsed
        atlas_where: sevenz.rs:352-353, 370 (dropped after use)
      - name: anti_items
        where: 'kAnti bitfield: deletion marker (update archives)'
        type: bitfield
        read_from: last_article
        use: rare; deletion flag
        proves: none
        leak: false
        status: VERIFIED
        source: w1b s5.7
        atlas: 'no'
        atlas_where: kAnti skipped at sevenz.rs:363; anti-items listed as files
      - name: names
        where: 'kName: external byte, then NUL-terminated UTF-16LE per file; ''/'' separator'
        type: utf16le
        read_from: last_article
        use: file path and packer directory tree
        proves: same_uploader
        leak: true
        status: VERIFIED
        source: w1b s5.7; w5c s4.4
        atlas: stored
        atlas_where: sevenz.rs:355-362 -> archive_inner_files.name
      - name: ctime_atime
        where: 'kCTime / kATime: fixed 8-byte FILETIME per defined file (UTC); presence follows -mtc/-mta'
        type: filetime
        read_from: last_article
        use: UTC times; presence reflects packer flags
        proves: same_uploader
        leak: true
        status: VERIFIED
        source: w1b s5.7
        atlas: 'no'
        atlas_where: kCTime/kATime skipped (sevenz.rs:363)
      - name: mtime
        where: 'kMTime: fixed 8-byte FILETIME per file (UTC)'
        type: filetime
        read_from: last_article
        use: UTC mtime; compare to Usenet Date
        proves: same_uploader
        leak: true
        status: VERIFIED
        source: w5c s1.9
        atlas: 'no'
        atlas_where: kMTime skipped (sevenz.rs:363)
      - name: win_attributes
        where: 'kWinAttrib: UINT32 per file; low 16 bits Windows attrs'
        type: uint32
        read_from: last_article
        use: dir, hidden, archive bits
        proves: tool
        leak: true
        status: VERIFIED
        source: w1b s5.7; w5c s6.6
        atlas: 'no'
        atlas_where: kWinAttrib skipped (sevenz.rs:363)
      - name: attr_unix_mode
        where: bit 0x8000 = Unix extension; high 16 bits = st_mode
        type: derived
        read_from: last_article
        use: symlink, permissions, umask
        proves: tool
        leak: true
        status: VERIFIED
        source: w5c s3.8
        atlas: 'no'
        atlas_where: high 16 bits of kWinAttrib not read (sevenz.rs:363)
      - name: start_pos
        where: kStartPos per defined file (rare)
        type: uint64
        read_from: last_article
        use: rare; ignore unless seen
        proves: none
        leak: false
        status: UNVERIFIED
        source: w1b s5.7
        atlas: 'no'
        atlas_where: kStartPos skipped (sevenz.rs:363)
      - name: dummy_padding
        where: 'kDummy 0x19: zero padding; nonzero bytes = header error'
        type: bytes
        read_from: last_article
        use: 7-Zip-style writer fingerprint
        proves: tool
        leak: true
        status: VERIFIED
        source: w8c h; w5c s6.7
        atlas: 'no'
        atlas_where: kDummy skipped (correct; sevenz.rs:363)
      - name: comment_record
        where: 'kComment 0x16: skipped as unknown property'
        type: record
        read_from: last_article
        use: not parsed
        proves: none
        leak: false
        status: VERIFIED
        source: w8c h
        atlas: 'no'
        atlas_where: kComment skipped (sevenz.rs:363)
      - name: archive_properties
        where: 'kArchiveProperties 0x02 and kAdditionalStreamsInfo 0x03: skip or external data'
        type: record
        read_from: last_article
        use: rare external names and times
        proves: none
        leak: false
        status: VERIFIED
        source: w1b s5.1-5.2
        atlas: 'no'
        atlas_where: kArchiveProperties / kAdditionalStreamsInfo not read (no branch)
      - name: external_flag
        where: External byte (0 inline) on name, time and attribute vectors
        type: uint8
        read_from: last_article
        use: 7-Zip writes 0
        proves: none
        leak: false
        status: VERIFIED
        source: w1b s5.7
        atlas: 'no'
        atlas_where: External byte not read
      coders:
      - name: lzma_props
        where: 'LZMA 030101: byte0 = (pb*5+lp)*9+lc (0x5D default); dict uint32 LE'
        type: record
        read_from: last_article
        use: lc/lp/pb and dict = settings fingerprint
        proves: tool
        leak: true
        status: VERIFIED
        source: w1b s6.2
        atlas: 'no'
        atlas_where: only props.len()==5 checked (w9a section 4); dict/lc/lp/pb not kept
      - name: lzma2_props
        where: 'LZMA2 21: 1 byte dictionary code'
        type: uint8
        read_from: last_article
        use: dict size (formula not confirmed)
        proves: tool
        leak: true
        status: VERIFIED
        source: w1b s6; 7zHeader.h k_LZMA2 0x21 (fetched); dict formula still not confirmed
        atlas: 'no'
        atlas_where: props passed to decoder, not kept
      - name: ppmd_props
        where: 'PPMd 030401: order byte + memSize uint32 LE'
        type: record
        read_from: last_article
        use: PPMd order and memory
        proves: tool
        leak: true
        status: VERIFIED
        source: w1b s6
        atlas: 'no'
        atlas_where: props not parsed
      - name: copy_method
        where: 'COPY 00: store (-mx0); packed == unpacked'
        type: derived
        read_from: first_article
        use: 'file i at 32+PackPos+sum(prior sizes): inner MKV readable'
        proves: tool
        leak: true
        status: VERIFIED
        source: w1b s8; 7zHeader.h k_Copy 0 (fetched)
        atlas: 'no'
        atlas_where: no method string kept (w9a section 4.1 method chain not kept)
      - name: branch_filters
        where: BCJ x86 03030103, PPC 03030205, IA64 03030401, ARM 03030501, ARMT 03030701, SPARC 03030805, ARM64 0A, RISC-V 0B; also SWAP2 020302 and SWAP4 020304 (IsFilterMethod)
        type: derived
        read_from: last_article
        use: filter chain; newer 7-Zip versions add ARM64 and RISC-V
        proves: tool
        leak: true
        status: VERIFIED
        source: w1b s6; log W8A; 7zHeader.h k_* constants and IsFilterMethod (fetched)
        atlas: 'no'
        atlas_where: filters not parsed; only LZMA header path (sevenz.rs:513-516)
      - name: bcj2_and_delta
        where: 'BCJ2 0303011B (4 in-streams); Delta 03 (1 byte: distance-1)'
        type: derived
        read_from: full
        use: partial decode harder for BCJ2
        proves: tool
        leak: true
        status: VERIFIED
        source: w1b s6; 7zHeader.h k_BCJ2 0x303011B, k_Delta 0x03 (fetched)
        atlas: 'no'
        atlas_where: not parsed
      - name: deflate_bzip2_ids
        where: Deflate 040108, BZip2 040202, Deflate64 040109 (footnotes disagree)
        type: derived
        read_from: last_article
        use: method ids
        proves: tool
        leak: true
        status: VERIFIED
        source: w1b s6; 7zHeader.h k_Deflate 0x40108, k_Deflate64 0x40109, k_BZip2 0x40202 (fetched)
        atlas: 'no'
        atlas_where: ids not kept (method chain not persisted)
      - name: fork_codec_ids
        where: ZSTD 04F71101, Brotli 04F71102, LZ4 04F71104, LZS 04F71105, Lizard 04F71106 (fork ids)
        type: derived
        read_from: last_article
        use: non-stock codecs
        proves: tool
        leak: true
        status: UNVERIFIED
        source: 'w1b s6; 7zHeader.h:(comment only) "0x4F71101, 7z-zstd": only the zstd id appears, as a comment; LZ4/Brotli/LZS/Lizard not in header'
        atlas: 'no'
        atlas_where: not parsed
      - name: aes_props
        where: 'props[0]: bits 0-5 NumCyclesPower; bit 0x80 = salt present; bit 0x40 = IV present. props[1]: high nibble = SaltSize-1, low nibble = IVSize-1 (salt size = bit7 + hi nibble, IV size = bit6 + lo nibble). Then
          salt bytes, then IV bytes. Encoder default: props[0]=0xD3 (cycles 19, salt, IV), props[1]=0x3F (salt 4, IV 16), total 22 bytes.'
        type: record
        read_from: last_article
        use: encryption detect without password
        proves: tool
        leak: true
        status: VERIFIED
        source: w1b s6.1; w7b s3.1; 7zAes.cpp:214-226 (fetched); proto sevenz_zip_meta.rs:429-439 matches decoder formula
        atlas: parsed
        atlas_where: sevenz.rs:181-183 (AES id -> encryption flag only; props not parsed)
      - name: aes_cycles_power
        where: NumCyclesPower (7-Zip default 19 = 2^19 SHA-256 rounds)
        type: derived
        read_from: last_article
        use: KDF cost; default fingerprint
        proves: tool
        leak: true
        status: VERIFIED
        source: w7b s3.1; 7zAes.cpp:236 (NumCyclesPower = 19) (fetched)
        atlas: 'no'
        atlas_where: 'not parsed (w9a section 4: AES props not parsed)'
      - name: aes_iv
        where: 16-byte random IV per AES coder (encoder _ivSize=16). A 4-byte salt is ALSO written by default (encoder SaltSize=4 in ResetSalt; props bit 0x80 set). Props therefore carry salt + IV.
        type: bytes16
        read_from: last_article
        use: per-archive twin key across volumes
        proves: twin
        leak: true
        status: VERIFIED
        source: 'w7b s3.1, s3.3; 7zAes.cpp:194-226 (fetched); superseded text: "no salt by default"'
        atlas: 'no'
        atlas_where: not parsed (w9a section 4)
      - name: aes_password_encoding
        where: password encoded as UTF-16LE bytes, no BOM
        type: derived
        read_from: last_article
        use: password test input encoding
        proves: none
        leak: false
        status: VERIFIED
        source: w8c h
        atlas: 'no'
        atlas_where: not in w9a (password path not inspected)
      - name: other_crypto_ids
        where: ZipCrypto 06F10101 and RAR29 crypto 06F10303 are not defined in 7zHeader.h; ids from w1b s6 only
        type: derived
        read_from: last_article
        use: legacy encryption ids
        proves: none
        leak: false
        status: UNVERIFIED
        source: w1b s6 (not re-checked; not in 7zHeader.h)
        atlas: 'no'
        atlas_where: not parsed; AES id only (sevenz.rs:181-183)
      - name: multivolume_logical_offsets
        where: '7z split (.7z.001...): offsets in logical stream; equal volume size assumed'
        type: derived
        read_from: last_article
        use: locate the volume holding the header
        proves: none
        leak: false
        status: UNVERIFIED
        source: w1b s7
        atlas: parsed
        atlas_where: steps.rs:353-364 (seven_list joins articles; logical-offset header search not verified)
    partial_decode:
      codec: LZMA2 and LZMA1 from offset 32 (+ BCJ and Delta chains)
      crate: lzma-rust2 0.25 Lzma2Reader (64 MiB dict)
      result: 'SOLVED for first folder: 10% packed -> 786 KB correct; MKV magic check; BCJ2 untested'
    rust:
      parse: hand-written (proto/sevenz_zip_meta.rs)
      decode: lzma-rust2 0.25 Lzma2Reader + filter::bcj/delta
      crypto: sha2 (7z KDF) + aes-256 cbc
  zip:
    detect:
      magic: 50 4B 03 04
      offset: 0
      variants: 50 4B 05 06 (empty), 50 4B 07 08 (spanned marker)
    structures:
      local_file_header:
      - name: lfh_version_needed
        where: '@4 uint16: 20, 45 (zip64), 46 (bzip2), 51 (AES), 63 (LZMA/PPMd)'
        type: uint16
        read_from: first_article
        use: feature check (zip64, AES)
        proves: tool
        leak: true
        status: VERIFIED
        source: w1c s1.1
        atlas: 'no'
        atlas_where: not read (w9a 5.1)
      - name: lfh_gp_flags
        where: '@6 uint16: bit0 encrypted, bit3 data descriptor, bit6 strong, bit11 UTF-8, bit13 CD masking; bits1-2 deflate mode'
        type: uint16
        read_from: first_article
        use: encryption, streaming writer, name encoding
        proves: tool
        leak: true
        status: VERIFIED
        source: w1c s1.7
        atlas: parsed
        atlas_where: zip.rs:36-38, 206, 244-246 (listing); probe/archive.rs:191 uses bit 0 only
      - name: lfh_method
        where: '@8 uint16: 0 store, 8 deflate, 9 deflate64, 12 bzip2, 14 LZMA, 93 zstd, 95 xz, 98 PPMd, 99 AE-x'
        type: uint16
        read_from: first_article
        use: codec; 99 = real method in 0x9901
        proves: tool
        leak: true
        status: VERIFIED
        source: w1c s1.8
        atlas: stored
        atlas_where: probe/archive.rs:189-204 -> ArchiveHead.method text; numeric value lost for "other"
      - name: lfh_dos_time_date
        where: '@10 time (h<<11|m<<5|s/2), @12 date; local clock, 2 s'
        type: uint32
        read_from: first_article
        use: local clock (no zone)
        proves: same_uploader
        leak: true
        status: VERIFIED
        source: w5c s1.3
        atlas: 'no'
        atlas_where: not read (w9a 5.1)
      - name: lfh_crc32
        where: '@14 uint32; 0 when data descriptor bit set'
        type: uint32
        read_from: first_article
        use: content fingerprint
        proves: twin
        leak: false
        status: VERIFIED
        source: w1c s1.1
        atlas: stored
        atlas_where: probe/archive.rs:207 (first entry, bit 3 clear); listing never reads it (zip.rs:217-237)
      - name: lfh_sizes
        where: '@18 compressed, @22 uncompressed (0xFFFFFFFF = see zip64 extra)'
        type: uint32
        read_from: first_article
        use: file size without download
        proves: none
        leak: false
