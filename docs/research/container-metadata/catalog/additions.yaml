# Atlas field catalog, additions (new entries only): HDR10+ T.35 in MKV, DV compat names, Atmos/DTS:X hints, dispositions, track start, tags, fetch plans
# Synthesized 2026-11-02 from raw/w9b.md (gap analysis, FFmpeg matroska.h and mkvdec.c source read), raw/w7a.md (DV MKV/MP4 test), raw/w6c.md (HDR label table), raw/w8c.md (fetch planner and storage).
# Duplicates checked against catalog/mkv.yaml, mp4.yaml, disc_other.yaml before writing. Existing ids are not repeated; new ids add a suffix or use a new name.
# verified: spec = EBML/Matroska spec XML or RFC text; source = FFmpeg source read; tested = local tool output; memory = unverified.
# atlas: parsed | partial | buggy | no. Entry form is one flow mapping per field (same keys as the schema).
schema_version: 1
container: additions
fields:
fields:
  # ---- Matroska BlockAdditionMapping, T.35 type (HDR10+ header signal)
  # ---- MP4 sample entry vendor
  # ---- Matroska tags missing from the catalog
  # ---- MP4 HDR10+ flag (bitstream SEI, no container box)
  # ---- Derived HDR labels
  # ---- Audio additional features
  # ---- Extra dispositions (ffprobe stream.disposition names, with container equivalents or none)
  # ---- Per-track start offset
  # ---- Per-container fetch plans (articles needed), from raw/w8c.md Note A
  - {id: mkv.block_addition.id_type_t35, path: "BlockAdditionMapping/BlockAddIDType = 4", raw: "0x41E7", type: uint, meaning: "BlockAddIDType 4 = ITU-T T.35 user data. Header-level signal that the track carries T.35 per-frame metadata (HDR10+ ST 2094-40, ST 2094 App 5, or LCEVC). Type 4 does not name HDR10+ by itself; the payload country and provider bytes do (see mkv.cluster.block_additional.itu_t35)", example: "4", location: front, location_note: "BlockAddIDValue must be 2 or more when type is not 0. BlockAddIDExtraData is optional for type 4; mkvdec.c needs 4 or more bytes only when several type-4 mappings exist. mkvmerge writing type 4 not checked (no mkvinfo on the box, w9b)", linking: [same_film], privacy: false, atlas: "no", verified: source, source: "raw/w9b.md section 2 (FFmpeg matroska.h:363,370; mkvdec.c; ebml_matroska.xml BlockAddIDType)", cost: first_article}
  - {id: mkv.cluster.block_additional.itu_t35, path: "Segment/Cluster/BlockGroup/BlockAdditional (BlockAddID = BlockAddIDValue of a type-4 mapping)", raw: "0xA5 under BlockGroup 0xA0; BlockAddID 0xEE", type: binary, meaning: "per-frame T.35 payload. Byte 0 = country (0xB5 US). Bytes 1-2 = provider, big endian: 0x003C = Samsung, HDR10+ (ST 2094-40); 0x0090 = SMPTE, ST 2094 App 5; 0x003B = Dolby (DV in AV1, memory). UK (0xB4) with provider 0x5000 = VNova LCEVC. Provider body follows, parsed by the streams thread", example: "b5 003c (illustrative)", location: front, location_note: "first Cluster, first keyframe; about 1 to 3 articles (w8c). Codec agnostic in FFmpeg (side data attached to any packet). No HDR10+ corpus file, so no positive test", linking: [same_film], privacy: false, atlas: "no", verified: source, source: "raw/w9b.md section 2 (FFmpeg mkvdec.c:4055-4095); DV provider 0x003B: memory", cost: first_4mb}
  - {id: mp4.stsd.vendor_id, path: "stbl/stsd/entry +20 (vendor fourcc, u32, after version u16 and revision u16)", raw: "stsd entry +20 u32", type: fourcc, meaning: "vendor fourcc written by the muxer for the sample entry; ffprobe exposes it as streams.tags.VENDOR_ID", example: "appl", location: front, location_note: "byte offset from memory (w9b asks for confirmation on a real MP4 before coding); moov at front in faststart files", linking: [tool], privacy: false, atlas: "no", verified: memory, source: "raw/w9b.md section 1 (FF streams.tags.VENDOR_ID)", cost: first_article}
  - {id: mkv.tag.artist, path: "Tags/Tag/SimpleTag[TagName=ARTIST]", raw: "n/a (string tag)", type: string, meaning: "performer for music or audio-only releases. ARTIST also appears inside mkv.tag.credits; this id is the dedicated audio key. MP4 equivalent: mp4.ilst.art_aart (aART and ©ART)", example: "Example Artist", location: tail, location_note: "mkvmerge writes Tags last (w8c), so the Tags Need from SeekHead is required", linking: [same_film], privacy: false, atlas: "no", verified: memory, source: "raw/w9b.md section 1 (mkv.tag.performer suggestion)", cost: tail}
  - {id: mkv.tag.composer, path: "Tags/Tag/SimpleTag[TagName=COMPOSER]", raw: "n/a (string tag)", type: string, meaning: "composer of the music or score. MP4 equivalent: mp4.ilst.wrt_cprt (©wrt, writer or composer)", example: "Example Composer", location: tail, location_note: "absent from mkv.yaml (grep found no COMPOSER)", linking: [same_film], privacy: false, atlas: "no", verified: memory, source: "raw/w9b.md section 1", cost: tail}
  - {id: mkv.tag.sort_with, path: "Tags/Tag/SimpleTag[TagName=SORT_WITH]", raw: "n/a (string tag)", type: string, meaning: "sort key for the title or artist (alphabetic form, for example without a leading article). MP4 has no equal atom; sosn and soar are not catalogued", example: "Matrix, The", location: tail, location_note: "absent from mkv.yaml (grep found no SORT_WITH); use for same-title grouping only, never as a name", linking: [none], privacy: false, atlas: "no", verified: memory, source: "raw/w9b.md section 1 (SORT_* suggestion)", cost: tail}
derived:
  - {id: derived.mp4.hdr10plus_sei_present, path: "derived: scan first IDR access unit SEI (itu-t T.35, country B5, provider 003C) in hvcC SEI arrays or first mdat sample", raw: "n/a", type: bool, meaning: "HDR10+ dynamic metadata present in the bitstream. MP4 has no BlockAdditional equivalent, so this is a sample-level flag, not a header signal", example: "true", location: front_or_tail, location_note: "needs the first sync sample. Not tested in corpus (w9b says memory-level)", linking: [same_film], privacy: false, atlas: "no", verified: memory, source: "raw/w9b.md section 2; raw/w6c.md section 3 row 7", cost: first_4mb}
  - {id: derived.hdr10plus_label, path: "derived from BlockAdditionMapping type 4 (mkv.block_addition.id_type_t35) plus BlockAdditional T.35 payload (mkv.cluster.block_additional.itu_t35), or in-band SEI (ts.video.hdr10plus_sei, derived.mp4.hdr10plus_sei_present)", raw: "n/a", type: string, meaning: "values: 'hdr10plus' (country B5, provider 003C), 'st2094_app5' (country B5, provider 0090), 'lcevc' (country B4, provider 5000), or none. Used as the HDR10+ add-on in derived.hdr_label_v2", example: "hdr10plus", location: front, location_note: "MKV: header mapping says type 4, then the first BlockAdditional gives the provider. No HDR10+ corpus file", linking: [same_film], privacy: false, atlas: "no", verified: source, source: "raw/w9b.md section 2; raw/w6c.md section 3 row 7 (ST 2094-40 code 0001: memory)", cost: first_4mb}
  - {id: derived.hdr_label_v2, path: "derived from DV record, transfer, primaries, matrix, bit depth, static SEI, derived.hdr10plus_label and the SPS VUI", raw: "n/a", type: string, meaning: "precedence, stop at first match: 1 DV record present (MKV BlockAdditionMapping dvcC/dvvC, MP4 dvcC/dvvC/dvwC) -> Dolby Vision with profile, level and derived.dv_format_compat; 2 profile 5 -> 'Dolby Vision Profile 5'; 3 profile 8.1 (compat 1) -> 'Dolby Vision Profile 8.1, HDR10 compatible'; 4 profile 8.2 (compat 2) -> 'SDR compatible'; 5 profile 8.4 (compat 4) -> 'HLG compatible'; 6 profile 7 -> 'Dolby Vision Profile 7'; 7 derived.hdr10plus_label not none -> append 'HDR10+' to the base label; 8 PQ (transfer 16) with SEI 137 or 144 (or MasteringMetadata or MaxCLL present) -> 'HDR10'; 9 PQ, BT.2020 and 10-bit or more, no static SEI found -> 'HDR10 (unconfirmed)'; 10 PQ otherwise -> 'PQ (HDR, no static metadata)'; 11 transfer 18 -> 'HLG'; 12 else -> 'SDR BT.709'. SPS VUI fallback: mkvmerge raw-HEVC files have no Colour element (w7a: dv81.mkv hdr=null), so transfer, primaries and matrix come from the SPS VUI when Colour is absent. Bit depth always from hvcC, never from Colour", example: "Dolby Vision Profile 8.1, HDR10 compatible, HDR10+", location: front_or_tail, location_note: "rules from w6c table (tested parts: SEI 137 and 144 in hvcC, bit depth in hvcC, DV profile and compat in dv81.mkv and dv5.mkv; untested: HLG, profile 7, HDR10+ mapping). Replaces derived.hdr_label for new code; the old id stays as is", linking: [same_film], privacy: false, atlas: "no", verified: memory, source: "raw/w6c.md section 3; raw/w7a.md section 4 and 5; raw/w9b.md section 2", cost: first_4mb}
  - {id: derived.dv_format_compat, path: "derived from dvcC/dvvC bl_signal_compatibility_id (MKV mkv.dvcc.compat_id, MP4 dvcC byte 4)", raw: "n/a", type: string, meaning: "MediaInfo HDR_Format_Compatibility name: 0 -> 'None' (profile 5); 1 -> 'HDR10'; 2 -> 'SDR'; 4 -> 'HLG'; other -> 'unknown'. Pairs with derived.dv_label for MediaInfo-style output", example: "HDR10", location: front, location_note: "compat 0 (profile 5) and 1 (profile 8.1) tested by mkvmerge on dv5.mkv and dv81.mkv (w7a); 2 and 4 from memory", linking: [same_film], privacy: false, atlas: "no", verified: memory, source: "raw/w9b.md section 1 (HDR_Format_Compatibility); raw/w7a.md section 3", cost: first_article}
  - {id: derived.atmos, path: "derived: MP4 dec3 flag_ec3_extension_type_a (JOC) with complexity_index_type_a; MKV A_EAC3 and A_TRUEHD have no container flag", raw: "n/a", type: string, meaning: "'atmos_joc' when mp4.dec3.joc_flag is set (E-AC-3 with Dolby Atmos). Otherwise none. MKV: bitstream only, so E-AC-3 substream extension and TrueHD MLP extension checks belong to the streams thread. MediaInfo naming (memory): 'Dolby Digital Plus with Dolby Atmos', feature JOC", example: "atmos_joc", location: front_or_tail, location_note: "MP4: dec3 in moov (tail when moov is at end). MKV: none at container level. TrueHD Atmos not signalled in MKV or MP4 box", linking: [same_film], privacy: false, atlas: "no", verified: memory, source: "raw/w9b.md section 3", cost: tail}
  - {id: derived.dtsx, path: "derived: MP4 stsd fourcc dtsx, dtsh, dtsc, dtsl (hint) and DTS:X extension in the stream (bitstream)", raw: "n/a", type: string, meaning: "container hint only. The stsd fourcc says DTS family; ddts does not name DTS:X. Final DTS:X answer comes from the DTS-HD extension substream in the bitstream (streams thread). Values: 'dtsx_candidate' from fourcc, 'dtsx' only after bitstream check, otherwise none", example: "dtsx_candidate", location: front_or_tail, location_note: "MKV A_DTS carries no DTS:X flag. IMAX Enhanced is not container level", linking: [none], privacy: false, atlas: "no", verified: memory, source: "raw/w9b.md section 3", cost: tail}
  - {id: derived.disposition_karaoke, path: "derived: track name or hdlr name matching karaoke text", raw: "n/a", type: bool, meaning: "karaoke track (ffprobe disposition.karaoke). MKV equivalent: none (TrackName text only, mkv.track.name). MP4 equivalent: none (hdlr name, mp4.hdlr.name). Heuristic only", example: "", location: front_or_tail, location_note: "no container flag exists in either format; name heuristic is a hint", linking: [none], privacy: false, atlas: "no", verified: memory, source: "raw/w9b.md section 1 (FF disposition list)", cost: first_article}
  - {id: derived.disposition_lyrics, path: "derived: track name matching lyrics text", raw: "n/a", type: bool, meaning: "lyrics track (ffprobe disposition.lyrics). MKV equivalent: none (mkv.track.name). MP4 equivalent: none (mp4.hdlr.name). Heuristic only", example: "", location: front_or_tail, location_note: "no container flag", linking: [none], privacy: false, atlas: "no", verified: memory, source: "raw/w9b.md section 1", cost: first_article}
  - {id: derived.disposition_captions, path: "derived: MKV subtitle track with FlagHearingImpaired (mkv.track.flag_hearing_impaired); MP4 sbtl track with stsd c608 (mp4.stsd.c608)", raw: "n/a", type: bool, meaning: "captions for the deaf and hard of hearing (ffprobe disposition.captions). MKV: FlagHearingImpaired set on a subtitle track. MP4: CEA-608 sample entry c608 marks closed captions. Plain subtitles are not captions", example: "", location: front, location_note: "MKV flag in Tracks, first article. MP4 c608 in stsd", linking: [same_subs], privacy: false, atlas: "no", verified: memory, source: "raw/w9b.md section 1; mkv.track.flag_hearing_impaired", cost: first_article}
  - {id: derived.disposition_dub, path: "derived: audio track with FlagOriginal 0 and a language that differs from the original (mkv.track.flag_original); name text", raw: "n/a", type: bool, meaning: "dubbed audio (ffprobe disposition.dub). MKV: no flag, only a hint from FlagOriginal 0 with the name. MP4: none. Not a reliable container signal", example: "", location: front, location_note: "hint only, do not store as a truth value", linking: [none], privacy: false, atlas: "no", verified: memory, source: "raw/w9b.md section 1 (FlagOriginal maps to track.flag_original)", cost: first_article}
  - {id: derived.disposition_clean_effects, path: "derived: audio track name matching clean effects or no dialogue text", raw: "n/a", type: bool, meaning: "clean effects track, no dialogue (ffprobe disposition.clean_effects). MKV equivalent: none (name text only). MP4 equivalent: none", example: "", location: front_or_tail, location_note: "no container flag; name heuristic only", linking: [none], privacy: false, atlas: "no", verified: memory, source: "raw/w9b.md section 1", cost: first_article}
  - {id: derived.disposition_still_image, path: "derived: MKV attached cover image in Attachments; MP4 ilst covr cover art; still video track with image codec", raw: "n/a", type: bool, meaning: "still image, not a moving track (ffprobe disposition.still_image). MKV: attachment with image MIME type (no track flag). MP4: covr cover art in ilst, or a video track with a jpeg or png sample entry", example: "", location: front_or_tail, location_note: "attachments sit in the header, covr in moov ilst", linking: [same_film], privacy: false, atlas: "no", verified: memory, source: "raw/w9b.md section 1; raw/w8c.md section 1 (font and cover attachments)", cost: first_article}
  - {id: derived.disposition_metadata, path: "derived: MKV TrackType 33 (metadata) (mkv.track.type); MP4 handler meta or data track (mp4.hdlr.handler_type)", raw: "n/a", type: bool, meaning: "metadata track (ffprobe disposition.metadata). MKV: track type value 33 in TrackType. MP4: hdlr meta or data handler. Not a presentation track", example: "", location: front, location_note: "TrackType read from Tracks; hdlr in moov", linking: [none], privacy: false, atlas: "no", verified: memory, source: "raw/w9b.md section 1; TrackType 33 from memory", cost: first_article}
  - {id: derived.disposition_dependent, path: "derived: none at container level (dependent track flag)", raw: "n/a", type: bool, meaning: "track depends on another track to decode (ffprobe disposition.dependent). MKV: no flag; the DV enhancement layer is in-band, not a separate track. MP4: no flag, tref dependency not catalogued. Report none", example: "", location: front_or_tail, location_note: "no equivalent; keep as none unless a stream parser proves it", linking: [none], privacy: false, atlas: "no", verified: memory, source: "raw/w9b.md section 1", cost: first_article}
  - {id: derived.track_start_offset, path: "derived: MKV first block timecode of the track (Cluster Timestamp plus block timecode, in TimestampScale ticks) vs 0; MP4 elst first entry (empty edit, media_time -1) or media_time offset", raw: "n/a", type: string, meaning: "per-track delay in ms before the first sample. MKV: first SimpleBlock or BlockGroup timecode of the track, relative to Segment start. MP4: empty edit segment_duration (mp4.elst.segment_duration) before media_time, or media_time greater than 0 (priming). Sum with derived.mp4.aac_priming_offset when both apply. Matches MediaInfo Delay and Duration_Start", example: "ms 1000 (A/V delay)", location: front, location_note: "MKV: first Cluster in the first 4 MB. MP4: moov (tail when moov is at end)", linking: [same_film], privacy: false, atlas: "no", verified: memory, source: "raw/w9b.md section 1 (Delay_Source, Duration_Start)", cost: first_4mb}
  - {id: derived.fetch_plan.mkv, path: "derived: SeekHead Tags and Chapters Needs for MKV; article count per release", raw: "n/a", type: string, meaning: "MKV header under about 1 MB: 1 article. Large fonts before Chapters: 1 plus 1 to 3 targeted (Chapters Need from SeekHead). Tags at end (mkvmerge): 1 plus 1 targeted Tags Need. Lavf: 1, layout is front. DV or HDR10+: 1 plus 1 to 3 (first keyframe in first Cluster). Budget 12 articles per release", example: "1 + 1 (Tags)", location: front, location_note: "SeekHead gives positions; 1 MB rule measured on b_multitrack.mkv", linking: [none], privacy: false, atlas: "no", verified: tested, source: "raw/w8c.md Note A table; corpus b_multitrack.mkv (measured)", cost: first_article}
  - {id: derived.fetch_plan.mp4_faststart, path: "derived: faststart MP4 fetch plan", raw: "n/a", type: string, meaning: "moov at front: 1 article for tracks, codec config, chapters (chpl), ilst, hdlr; 0 to 1 more for large moov (2 hour film, 2 tracks is about 1 to 2 MB). Budget 12 articles per release", example: "1 article", location: front, location_note: "faststart all tracks at 700 KB measured (w8c)", linking: [none], privacy: false, atlas: "no", verified: tested, source: "raw/w8c.md Note A table", cost: first_article}
  - {id: derived.fetch_plan.mp4_moov_end, path: "derived: moov at end: moov offset = mdat offset + mdat size, then article range", raw: "n/a", type: string, meaning: "ftyp and mdat header in the first article; 1 to 2 more at mdat_off + mdat_size for moov, which gives exact frame count, bitrate and GOP from stsz, stts, stss. Size 0 mdat means to EOF; size 1 means 64-bit largesize. Same math as derived.mp4.tail_fetch_plan", example: "1 + 2", location: tail, location_note: "nothing at 700 KB or 4 MB today; full file needed without this plan (w8c measured)", linking: [none], privacy: false, atlas: "no", verified: spec, source: "raw/w8c.md Note A table and section 2 (spec offset rule)", cost: tail}
  - {id: derived.fetch_plan.mp4_fragmented, path: "derived: fragmented MP4 fetch plan (mfra and tfra)", raw: "n/a", type: string, meaning: "moov with mvex: 1 article; mfra and tfra index at end: 1 tail article, gives duration and fragment times. Exact frame count needs a walk of every moof and trun, about 3600 moofs for a 2 hour film at 2 s fragments, beyond budget. Use mfra duration and accept a frame estimate", example: "1 + 1 tail", location: tail, location_note: "frame count is an estimate for fragmented input", linking: [none], privacy: false, atlas: "no", verified: spec, source: "raw/w8c.md Note A and What this cannot do", cost: tail}
  - {id: derived.fetch_plan.bdmv_iso, path: "derived: UDF BDMV ISO fetch plan (AVDP at 0x80000, VDS, FSD, metadata partition)", raw: "n/a", type: string, meaning: "1 article for VRS, AVDP at byte 0x80000 (inside the first article) and VDS; 2 to 4 more for FSD, index.bdmv, PLAYLIST .mpls and the main candidate CLPI. Index.bdmv sits at sector 4320 (about 8.4 MB) in the ImgBurn sample. Playlists past budget are skipped, so the main title falls back to the longest candidate seen", example: "1 + 3", location: tail, location_note: "playlist offsets estimated, not measured", linking: [none], privacy: false, atlas: "no", verified: spec, source: "raw/w8c.md Note A table (ImgBurn measured; libbluray 1.5.0 layout spec)", cost: tail}
  - {id: derived.fetch_plan.dvd_iso, path: "derived: DVD-Video ISO fetch plan (VIDEO_TS.IFO and VTS IFO)", raw: "n/a", type: string, meaning: "1 article for VIDEO_TS.IFO (567,296) and VTS_01_0.IFO (632,832) when both are inside the first article; 0 to 1 more for VTS_01_0.IFO if it crosses the boundary; 1 per further VTS IFO (second VTS near 21 MB). DVDDiscID needs whole VIDEO_TS.IFO and VTS IFOs", example: "1 (+1 per VTS)", location: front_or_tail, location_note: "offsets measured on genisoimage output", linking: [none], privacy: false, atlas: "no", verified: tested, source: "raw/w8c.md Note A table (measured)", cost: first_article}
  - {id: derived.fetch_plan.rar_store, path: "derived: RAR m0 store, RAR4 or RAR5 multi-volume fetch plan", raw: "n/a", type: string, meaning: "1 article for volume 1 header plus the start of the inner MKV or MP4 (stored_at from archive::parse). 1 per Need, mapped by the layout: volume = floor(X / data_len), offset = data_start + X mod data_len, part = floor(offset / part_size) + 1. 1 for the last volume first article (moviehash, 64 KiB at stored_at + packed - 64 KiB). Begin == offset + 1 check per article. Budget 12", example: "1 + 1 per Need + 1 tail", location: front_or_tail, location_note: "not run on a real release (w8c)", linking: [same_film], privacy: false, atlas: "no", verified: spec, source: "raw/w8c.md Note A (layout and moviehash)", cost: tail}
  - {id: derived.fetch_plan.rar_compressed, path: "derived: RAR m1 to m5 (compressed) fetch plan", raw: "n/a", type: string, meaning: "1 article for headers only (name, sizes, CRC32, method). 0 more: no inner media without a pure-Rust decoder (rars 0.12.3 is young). Encrypted RAR gives headers only", example: "1 (headers)", location: front, location_note: "archive thread owns the decoder decision", linking: [none], privacy: false, atlas: "no", verified: tested, source: "raw/w8c.md Note A table and What this cannot do", cost: first_article}
  - {id: derived.fetch_plan.7z_copy, path: "derived: 7z copy-mode fetch plan (data at offset 32 of .001)", raw: "n/a", type: string, meaning: "1 article for the 7z signature header and the start of the packed stream. 1 per Need at 32 + PackPos + X across .001, .002 and so on. Same Need model as rar_store. Solid blocks: only the first file is reachable", example: "1 + 1 per Need", location: front_or_tail, location_note: "spec offset rule; archive thread", linking: [none], privacy: false, atlas: "no", verified: spec, source: "raw/w8c.md Note A table (7z copy, spec)", cost: tail}
  - {id: derived.fetch_plan.7z_lzma2, path: "derived: 7z LZMA2 (compressed) fetch plan", raw: "n/a", type: string, meaning: "not random access. 1 article plus compressed articles read sequentially up to the decode offset of the inner MKV front, capped by the budget. Measured prefix decode with lzma-rust2 (64 MiB dictionary) gave 786 KB of MKV from 10 percent of a small archive; not measured on real archive sizes", example: "1 + sequential prefix", location: front, location_note: "front of inner file only", linking: [none], privacy: false, atlas: "no", verified: tested, source: "raw/w8c.md Note A table (measured on a small archive)", cost: first_4mb}
