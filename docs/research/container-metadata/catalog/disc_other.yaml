# Atlas field catalog, part 3: disc images and other containers (ISO9660, UDF, BDMV, DVD-Video IFO/VOB, MPEG-TS/M2TS, AVI, ASF, Ogg, FLV, MPEG-PS)
# Synthesized 2026-11-02 from raw/w1c.md, w2c.md, w3b.md (libbluray/libdvdread source read), w3c.md, w4c.md, w6a.md (local DVD/TS/AVI samples), w7b.md (libdvdread 6.1.3 DVDDiscID confirmed) and the Catalog schema in log.md.
# verified: spec = standard text or GUID table; source = upstream C/Rust/ffmpeg source read (libbluray, libdvdread, libudfread, ecma_167.h, ffmpeg mpegts.c); tested = output of samples built on this box (genisoimage, dvdauthor, ffmpeg, mkvmerge); memory = unverified, check before coding.
# atlas: parsed | partial | buggy | no. Atlas parses none of these containers today, so every atlas value here is "no".
# location: front (within the first article) | tail | targeted_fetch (needs a seek by directory record or pointer) | separate_file (a file inside the disc image or RAR set; location_note says where it sits).
# Offsets are from the start of the named structure unless the path says otherwise. BD PlayItem offsets are from the item's own 2-byte length field, as libbluray reads them.
# Sources disagree on a few BD offsets (connection_condition byte, STN start convention). Those entries say so.
schema_version: 1
container: disc_and_other

iso9660:
  - {id: iso.system_area, path: "sectors 0-15 (bytes 0x0000-0x7FFF)", raw: "byte 0x0000", type: binary, meaning: "system area; usually zero or boot code; no metadata in most authoring tools", example: "all zero", location: front, location_note: "first article covers it", linking: [none], privacy: false, atlas: "no", verified: spec, source: "raw/w1c.md", cost: first_article}
  - {id: iso.vrs, path: "volume recognition sequence, sectors 16-20", raw: "sector 16+ descriptor id at byte 1 ('CD001', 'BEA01', 'NSR02'/'NSR03', 'TEA01')", type: string, meaning: "tells a UDF image (NSR02/NSR03 present) from a plain ISO9660 image", example: "16 CD001, 17 CD001 terminator, 18 BEA01, 19 NSR02, 20 TEA01", location: front, location_note: "genisoimage -udf output", linking: [none], privacy: false, atlas: "no", verified: tested, source: "raw/w6a.md", cost: first_article}
  - {id: iso.pvd.type_id, path: "Primary Volume Descriptor +0", raw: "0x8000 byte 0", type: uint, meaning: "1 = primary volume descriptor; 255 = terminator", example: "1", location: front, location_note: "sector 16", linking: [none], privacy: false, atlas: "no", verified: spec, source: "raw/w2c.md", cost: first_article}
  - {id: iso.pvd.standard_id, path: "PVD +1 (5 bytes)", raw: "0x8001", type: string, meaning: "ECMA-119 standard identifier", example: "CD001", location: front, location_note: "", linking: [none], privacy: false, atlas: "no", verified: spec, source: "raw/w2c.md", cost: first_article}
  - {id: iso.pvd.system_id, path: "PVD +8 (32 bytes, a-chars)", raw: "0x8008", type: string, meaning: "system identifier, generic (LINUX, WIN32); weak", example: "LINUX", location: front, location_note: "", linking: [none], privacy: false, atlas: "no", verified: spec, source: "raw/w2c.md", cost: first_article}
  - {id: iso.pvd.volume_id, path: "PVD +40 (32 bytes, d-chars, space padded)", raw: "0x8028", type: string, meaning: "disc label set by the mastering tool; reused across releases, so only a weak same-disc key", example: "ATLAS_DVD", location: front, location_note: "same value libdvdread returns from DVDISOVolumeInfo", linking: [same_disc], privacy: false, atlas: "no", verified: tested, source: "raw/w7b.md", cost: first_article}
  - {id: iso.pvd.volume_space_size, path: "PVD +80 (both-endian u32)", raw: "0x8050", type: uint, meaning: "image size in 2048-byte sectors; size check for truncated posts and twin candidates", example: "10561", location: front, location_note: "", linking: [twin, alt], privacy: false, atlas: "no", verified: tested, source: "raw/w7b.md", cost: first_article}
  - {id: iso.pvd.volume_set_size, path: "PVD +120 (both-endian u16)", raw: "0x8078", type: uint, meaning: "number of discs in the set", example: "1", location: front, location_note: "", linking: [none], privacy: false, atlas: "no", verified: spec, source: "raw/w2c.md", cost: first_article}
  - {id: iso.pvd.logical_block_size, path: "PVD +128 (both-endian u16)", raw: "0x8080", type: uint, meaning: "logical block size; 2048 on every disc seen", example: "2048", location: front, location_note: "", linking: [none], privacy: false, atlas: "no", verified: tested, source: "raw/w6a.md", cost: first_article}
  - {id: iso.pvd.root_dir_record, path: "PVD +156 (34-byte directory record)", raw: "0x809C", type: binary, meaning: "root directory record: extent LBA at record +2 and data length at +10; start of the whole directory tree", example: "extent 274, size 2048", location: front, location_note: "root extent 274 in the 1-title sample", linking: [none], privacy: false, atlas: "no", verified: tested, source: "raw/w6a.md", cost: first_article}
  - {id: iso.pvd.volume_set_id, path: "PVD +190 (128 bytes, d-chars)", raw: "0x80BE", type: string, meaning: "volume set id as written by the tool; blank in genisoimage output (UDF set id is the one libdvdread uses)", example: "(blank)", location: front, location_note: "", linking: [same_disc], privacy: false, atlas: "no", verified: tested, source: "raw/w7b.md", cost: first_article}
  - {id: iso.pvd.publisher_id, path: "PVD +318 (128 bytes, a-chars)", raw: "0x813E", type: string, meaning: "publisher string set by the mastering tool; blank on home-made discs; pressed-disc values not checked", example: "(blank)", location: front, location_note: "", linking: [alt], privacy: false, atlas: "no", verified: tested, source: "raw/w7b.md", cost: first_article}
  - {id: iso.pvd.data_preparer_id, path: "PVD +446 (128 bytes, a-chars)", raw: "0x81BE", type: string, meaning: "preparer string set with genisoimage -p; can name a person or a shop", example: "(blank)", location: front, location_note: "blank in tested output; no -p build tested", linking: [alt], privacy: true, atlas: "no", verified: tested, source: "raw/w7b.md", cost: first_article}
  - {id: iso.pvd.application_id, path: "PVD +574 (128 bytes, a-chars)", raw: "0x023E", type: string, meaning: "mastering tool signature; genisoimage writes its 'GENISOIMAGE ISO 9660/HFS FILESYSTEM CREATOR' string here", example: "GENISOIMAGE ISO 9660/HFS FILESYSTEM CREATOR (C) 1993 E.YOUNGDALE", location: front, location_note: "", linking: [alt], privacy: false, atlas: "no", verified: tested, source: "raw/w7b.md", cost: first_article}
  - {id: iso.pvd.copyright_file_id, path: "PVD +702 (37 bytes)", raw: "0x02BE", type: string, meaning: "name of the copyright file in the root; usually blank", example: "(blank)", location: front, location_note: "", linking: [none], privacy: false, atlas: "no", verified: spec, source: "raw/w2c.md", cost: first_article}
  - {id: iso.pvd.abstract_file_id, path: "PVD +739 (37 bytes)", raw: "0x02E3", type: string, meaning: "name of the abstract file; usually blank", example: "(blank)", location: front, location_note: "", linking: [none], privacy: false, atlas: "no", verified: spec, source: "raw/w2c.md", cost: first_article}
  - {id: iso.pvd.bibliographic_file_id, path: "PVD +776 (37 bytes)", raw: "0x0308", type: string, meaning: "name of the bibliographic file; usually blank", example: "(blank)", location: front, location_note: "", linking: [none], privacy: false, atlas: "no", verified: spec, source: "raw/w2c.md", cost: first_article}
  - {id: iso.pvd.creation_date, path: "PVD +813 (17-byte dec-datetime)", raw: "0x032D", type: date, meaning: "mastering time: YYYYMMDDHHMMSS + hundredths + GMT offset byte; all zero or spaces = not set", example: "2026110207180200", location: front, location_note: "same time in both PVD and UDF recording time from one run", linking: [alt], privacy: false, atlas: "no", verified: tested, source: "raw/w6a.md", cost: first_article}
  - {id: iso.pvd.modification_date, path: "PVD +830 (17 bytes)", raw: "0x033E", type: date, meaning: "last modification time of the volume descriptor", example: "2026110207180200", location: front, location_note: "", linking: [alt], privacy: false, atlas: "no", verified: spec, source: "raw/w2c.md", cost: first_article}
  - {id: iso.pvd.expiration_date, path: "PVD +847 (17 bytes)", raw: "0x034F", type: date, meaning: "expiration time; usually unset", example: "(unset)", location: front, location_note: "", linking: [none], privacy: false, atlas: "no", verified: spec, source: "raw/w2c.md", cost: first_article}
  - {id: iso.pvd.effective_date, path: "PVD +864 (17 bytes)", raw: "0x0360", type: date, meaning: "effective time; usually unset", example: "(unset)", location: front, location_note: "", linking: [none], privacy: false, atlas: "no", verified: spec, source: "raw/w2c.md", cost: first_article}
  - {id: iso.pvd.file_structure_version, path: "PVD +881 (u8)", raw: "0x0371", type: uint, meaning: "ECMA-119 file structure version; 1", example: "1", location: front, location_note: "", linking: [none], privacy: false, atlas: "no", verified: spec, source: "raw/w2c.md", cost: first_article}
  - {id: iso.dirrec.extent_and_size, path: "directory record: extent LBA and data length", raw: "record +2 (both-endian u32 LBA), +10 (both-endian u32 length)", type: uint, meaning: "walk directory records to find any file (VIDEO_TS/, BDMV/, a VOB or m2ts) by LBA and size; fixed LBAs are not reliable", example: "VIDEO_TS.IFO LBA 277 size 12288", location: targeted_fetch, location_note: "root is at sector 274 in the 1-title sample; on a 2-title disc VTS_02 IFO sat at LBA 10413 (~21 MB)", linking: [none], privacy: false, atlas: "no", verified: tested, source: "raw/w7b.md", cost: targeted}
  - {id: iso.dirrec.file_identifier, path: "directory record +32 (length byte) and +33 (name)", raw: "0x21 length, 0x22 name", type: string, meaning: "ISO9660 name with ';1' version suffix; UDF names can be longer, so prefer UDF names when present", example: "VTS_01_0.IFO;1", location: targeted_fetch, location_note: "", linking: [none], privacy: false, atlas: "no", verified: tested, source: "raw/w6a.md", cost: targeted}

udf:
  - {id: udf.avdp.location, path: AVDP (tag 2) at sector 256, raw: byte 0x80000 (LBA 256); fallback last sector minus 256, type: binary, meaning: anchor to the main and reserve volume descriptor sequences; the first thing a UDF reader checks, example: 'tag id 2, main VDS LBA 32 length 32768', location: front, location_note: byte 524288 is inside the first 700 KB article only if the article starts at image start, linking: [none], privacy: false, atlas: 'no', verified: tested, source: raw/w4c.md, cost: first_article}
  - {id: udf.avdp.main_vds_extent, path: 'AVDP +16 extent_ad (len u32, loc u32)', raw: '0x10', type: binary, meaning: location and length of the main volume descriptor sequence; reserve sequence at +24, example: loc 32 len 32768, location: front, location_note: '', linking: [none], privacy: false, atlas: 'no', verified: tested, source: raw/w6a.md, cost: first_article}
  - {id: udf.tag.identifier, path: "any UDF descriptor tag +0", raw: "u16 at +0 (1 PVD, 2 AVDP, 4 IUVD, 5 PD, 6 LVD, 8 TD, 9 LVID, 256 FSD, 257 FID, 261 FE, 266 EFE)", type: uint, meaning: "descriptor type; checksum at +4 and CRC at +8 validate it", example: "1", location: front, location_note: "", linking: [none], privacy: false, atlas: "no", verified: source, source: "raw/w2c.md", cost: first_article}
  - {id: udf.tag.location, path: "any UDF descriptor tag +12", raw: "0x0C (u32 LE)", type: uint, meaning: "block number the descriptor was written to; a copy at another location is a mirror, not a different descriptor", example: "1", location: front, location_note: "", linking: [none], privacy: false, atlas: "no", verified: source, source: "raw/w2c.md", cost: first_article}
  - {id: udf.pvd.volume_identifier, path: "UDF Primary Volume Descriptor (tag 1) +24 (dstring 32)", raw: "0x18", type: string, meaning: "UDF volume label", example: "ATLAS_DVD", location: front, location_note: "VDS is in the first ~1 MB", linking: [same_disc], privacy: false, atlas: "no", verified: tested, source: "raw/w7b.md", cost: first_4mb}
  - {id: udf.pvd.volume_set_identifier, path: "UDF PVD +72 (dstring 128)", raw: "0x48", type: string, meaning: "volume set id that DVDUDFVolumeInfo returns (16 hex digits on genisoimage); tool-written, test on pressings before using as a key", example: "6AE8392A00001C38", location: front, location_note: "", linking: [same_disc], privacy: false, atlas: "no", verified: tested, source: "raw/w7b.md", cost: first_4mb}
  - {id: udf.pvd.recording_date_time, path: "UDF PVD +376 (timestamp 12)", raw: "0x178", type: date, meaning: "mastering time in UDF timestamp form (type/tz u16, year u16, month, day, hour, minute, second, centi, hundreds-of-us, us)", example: "2026-11-02 07:18:02 (local)", location: front, location_note: "", linking: [alt], privacy: false, atlas: "no", verified: tested, source: "raw/w7b.md", cost: first_4mb}
  - {id: udf.pvd.application_identifier, path: "UDF PVD +344 (regid 32)", raw: "0x158", type: string, meaning: "authoring application regid (flags byte, ident, suffix)", example: "(not seen in tested output)", location: front, location_note: "", linking: [alt], privacy: false, atlas: "no", verified: source, source: "raw/w2c.md", cost: first_4mb}
  - {id: udf.pvd.implementation_identifier, path: "UDF PVD +388 (regid 32)", raw: "0x184", type: string, meaning: "writer identity; genisoimage writes '*genisoimage' with zero suffix (the strongest home-made tell); ImgBurn/AnyDVD strings unverified", example: "*genisoimage", location: front, location_note: "", linking: [alt], privacy: false, atlas: "no", verified: tested, source: "raw/w7b.md", cost: first_4mb}
  - {id: udf.pvd.implementation_use, path: "UDF PVD +420 (bytes 64)", raw: "0x1A4", type: binary, meaning: "vendor data; may hold a tool string; not tested", example: "(unknown)", location: front, location_note: "", linking: [alt], privacy: false, atlas: "no", verified: memory, source: "raw/w2c.md", cost: first_4mb}
  - {id: udf.pd.partition_start, path: "UDF Partition Descriptor (tag 5) +188 (u32)", raw: "0xBC", type: uint, meaning: "physical start LBA of the partition; every partition-relative extent (file data, ICBs) adds this", example: "257", location: front, location_note: "PD is in the main VDS; 257 in both genisoimage samples", linking: [none], privacy: false, atlas: "no", verified: source, source: "raw/w4c.md", cost: first_4mb}
  - {id: udf.lvd.logical_volume_identifier, path: "UDF LVD (tag 6) +84 (dstring 128)", raw: "0x54", type: string, meaning: "logical volume label; normally equal to the PVD label", example: "ATLAS_DVD", location: front, location_note: "", linking: [same_disc], privacy: false, atlas: "no", verified: tested, source: "raw/w7b.md", cost: first_4mb}
  - {id: udf.lvd.logical_block_size, path: "UDF LVD +212 (u32)", raw: "0xD4", type: uint, meaning: "logical block size; 2048", example: "2048", location: front, location_note: "", linking: [none], privacy: false, atlas: "no", verified: tested, source: "raw/w7b.md", cost: first_4mb}
  - {id: udf.lvd.domain_identifier, path: "UDF LVD +216 (regid 32)", raw: "0xD8", type: string, meaning: "domain regid; '*OSTA UDF Compliant' with revision suffix", example: "*OSTA UDF Compliant", location: front, location_note: "", linking: [none], privacy: false, atlas: "no", verified: tested, source: "raw/w7b.md", cost: first_4mb}
  - {id: udf.lvd.implementation_identifier, path: "UDF LVD +272 (regid 32)", raw: "0x110", type: string, meaning: "writer identity for the logical volume; '*genisoimage' on home-made discs", example: "*genisoimage", location: front, location_note: "", linking: [alt], privacy: false, atlas: "no", verified: tested, source: "raw/w7b.md", cost: first_4mb}
  - {id: udf.lvd.partition_map_table, path: "UDF LVD +268 (count) and +440 (maps)", raw: "0x10C count, 0x1B8 maps", type: binary, meaning: "partition maps: type 1 physical; type 2 virtual or metadata (identifier '*UDF Metadata Partition')", example: "1 map on plain UDF; 2 on BD metadata-partition discs", location: front, location_note: "", linking: [none], privacy: false, atlas: "no", verified: source, source: "raw/w4c.md", cost: first_4mb}
  - {id: udf.metadata_file_icb, path: "metadata partition map entry: metadata file ICB", raw: "map entry field (partition-relative LBA)", type: extent, meaning: "locates the metadata file that holds FSD and FIDs; absolute address = partition_start + LBA", example: "partition_start 257 + metadata lbn", location: targeted_fetch, location_note: "partition-relative; may need one extra article beyond the first 1 MB", linking: [none], privacy: false, atlas: "no", verified: source, source: "raw/w4c.md", cost: first_4mb}
  - {id: udf.metadata_mirror_icb, path: "metadata partition map entry: mirror ICB (file type 251)", raw: "map entry mirror LBA", type: extent, meaning: "copy of the metadata ICB; reader fallback when the main one is bad", example: "", location: targeted_fetch, location_note: "", linking: [none], privacy: false, atlas: "no", verified: source, source: "raw/w4c.md", cost: first_4mb}
  - {id: udf.iuvd.implementation_identifier, path: "UDF Implementation Use Volume Descriptor (tag 4) +20 (regid 32)", raw: "0x14", type: string, meaning: "'*UDF LV Info' marker; LVInfo owner, organisation and contact fields follow", example: "*UDF LV Info", location: front, location_note: "", linking: [alt], privacy: false, atlas: "no", verified: tested, source: "raw/w6a.md", cost: first_4mb}
  - {id: udf.iuvd.lvinfo_owner_fields, path: "IUVD LVInfo1 +244, LVInfo2 +280, LVInfo3 +316 (dstring 36 each)", raw: "0xF4, 0x118, 0x13C", type: string, meaning: "owner name, organisation and contact as the tool wrote them; can hold personal data; blank on genisoimage", example: "(blank)", location: front, location_note: "layout from memory; LVInfo usage by tools unverified", linking: [alt], privacy: true, atlas: "no", verified: memory, source: "raw/w2c.md", cost: first_4mb}
  - {id: udf.lvid.integrity, path: "Logical Volume Integrity Descriptor (tag 9), via LVD integrity extent +432", raw: "LVD +432 extent_ad", type: binary, meaning: "recording time, next unique id, file and directory counts; file count can fingerprint one file set", example: "(not read)", location: targeted_fetch, location_note: "extent points to a block elsewhere in the partition", linking: [same_film], privacy: false, atlas: "no", verified: memory, source: "raw/w2c.md", cost: targeted}
  - {id: udf.fsd.root_icb, path: "File Set Descriptor (tag 256) at partition or metadata LBA 0; root ICB long_ad at +400", raw: "FSD +400 (LBA at +404)", type: extent, meaning: "root directory ICB; start of the UDF file tree", example: "root ICB lbn 2 (absolute 259)", location: targeted_fetch, location_note: "lbn is partition-relative; FSD also holds a recording timestamp near +16", linking: [none], privacy: false, atlas: "no", verified: tested, source: "raw/w6a.md", cost: first_4mb}
  - {id: udf.fe.file_entry, path: "File Entry (tag 261) or Extended File Entry (tag 266)", raw: "ICB block; tag at +0; allocation descriptors after the fixed part", type: binary, meaning: "per-file size and allocation descriptors (where the data lies); genisoimage writes tag 261 with one extent per file", example: "VIDEO_TS FE at lbn 6 (absolute 263)", location: targeted_fetch, location_note: "small discs keep directory entries near the partition start", linking: [none], privacy: false, atlas: "no", verified: tested, source: "raw/w6a.md", cost: first_4mb}
  - {id: udf.fid.directory_entry, path: "File Identifier Descriptor (tag 257) in directory data", raw: "characteristics +18, L_FI +19, ICB long_ad +20, L_IU +36, name +38+L_IU", type: binary, meaning: "one directory entry: name and ICB pointer; directories on metadata-partition discs read through the metadata file", example: "VIDEO_TS", location: targeted_fetch, location_note: "entries are 4-byte aligned", linking: [none], privacy: false, atlas: "no", verified: source, source: "raw/w4c.md", cost: targeted}
  - {id: udf.file_extent_ad, path: "short_ad / long_ad in File Entry allocation descriptors", raw: "ad: u32 length (top 2 bits = type), u32 LBA", type: extent, meaning: "data location of one file extent; absolute = partition_start + LBA; a BD m2ts can list 10 or more extents", example: "STREAM/00001.m2ts in 10 extents (ImgBurn sample)", location: targeted_fetch, location_note: "data extents are partition-relative", linking: [none], privacy: false, atlas: "no", verified: source, source: "raw/w4c.md", cost: targeted}

bdmv:
  - {id: bdmv.index.magic, path: "BDMV/index.bdmv bytes 0-3", raw: "0x00 'INDX'", type: string, meaning: "index file magic", example: "INDX", location: separate_file, location_note: "BDMV/index.bdmv; in one ImgBurn excerpt it starts at sector 4320 (~8.4 MB into the image), so a 4 MB read can miss it (single sample)", linking: [none], privacy: false, atlas: "no", verified: source, source: "raw/w3b.md", cost: targeted}
  - {id: bdmv.index.version, path: "index.bdmv +4 (4 ASCII)", raw: "0x04", type: string, meaning: "0100 and 0200 BD; 0240 accepted; 0300 is the UHD marker", example: "0300", location: separate_file, location_note: "BDMV/index.bdmv", linking: [none], privacy: false, atlas: "no", verified: source, source: "raw/w3b.md", cost: targeted}
  - {id: bdmv.index.indexes_start, path: "index.bdmv +8 (u32)", raw: "0x08", type: uint, meaning: "offset of the indexes block (title table)", example: "", location: separate_file, location_note: "", linking: [none], privacy: false, atlas: "no", verified: source, source: "raw/w3b.md", cost: targeted}
  - {id: bdmv.index.extension_start, path: "index.bdmv +12 (u32)", raw: "0x0C", type: uint, meaning: "offset of extension data (holds the 3.1 UHD flags)", example: "", location: separate_file, location_note: "", linking: [none], privacy: false, atlas: "no", verified: source, source: "raw/w3b.md", cost: targeted}
  - {id: bdmv.index.appinfo_len, path: "AppInfoBDMV +40 (u32)", raw: "0x28", type: uint, meaning: "AppInfo length; expected 34", example: "34", location: separate_file, location_note: "", linking: [none], privacy: false, atlas: "no", verified: source, source: "raw/w3b.md", cost: targeted}
  - {id: bdmv.index.appinfo_flags, path: "AppInfoBDMV +44 (byte)", raw: "0x2C bit7 skip, bit6 initial_output_mode (0 2D, 1 3D), bit5 content_exist_flag, bit4 skip, bits3-0 initial_dynamic_range_type", type: bits, meaning: "first-play output mode and the initial dynamic range class of the disc", example: "0x21 (2D, content present, dynamic range 1)", location: separate_file, location_note: "", linking: [none], privacy: false, atlas: "no", verified: source, source: "raw/w3b.md", cost: targeted}
  - {id: bdmv.index.appinfo_video, path: "AppInfoBDMV +45 (byte)", raw: "0x2D bits7-4 video_format, bits3-0 frame_rate", type: bits, meaning: "disc-level video format and frame rate, same code table as MPLS STN", example: "0x81 (2160p, 23.976)", location: separate_file, location_note: "", linking: [none], privacy: false, atlas: "no", verified: source, source: "raw/w3b.md", cost: targeted}
  - {id: bdmv.index.appinfo_user_data, path: "AppInfoBDMV +46 (32 bytes user_data)", raw: "0x2E-0x4D", type: binary, meaning: "free bytes the authoring tool can fill; may carry a tool string", example: "(unknown)", location: separate_file, location_note: "", linking: [alt], privacy: false, atlas: "no", verified: source, source: "raw/w3b.md", cost: targeted}
