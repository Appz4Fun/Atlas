  - {id: derived.same_disc_key_dvd, path: "derived: DVD same-disc key = dvd.discid (MD5 of IFOs)", raw: "n/a", type: binary, meaning: "strongest DVD dedupe key; same for all rips of one disc", example: "918d26bab2dcf09adf08a37da9267d21", location: targeted_fetch, location_note: "", linking: [same_disc], privacy: false, atlas: "no", verified: tested, source: "raw/w7b.md", cost: targeted}
  - {id: derived.same_disc_key_bd, path: "derived: BD same-disc candidate = id.bdmv disc_id (16 bytes) plus MPLS clip id set", raw: "n/a", type: binary, meaning: "candidate dedupe key; per-pressing behaviour not confirmed", example: "", location: separate_file, location_note: "test on two rips of one release before trusting", linking: [same_disc], privacy: false, atlas: "no", verified: memory, source: "raw/w3b.md", cost: targeted}
