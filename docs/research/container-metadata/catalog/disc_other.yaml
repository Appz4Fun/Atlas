ogg:
  - {id: ogg.page.magic, path: "Ogg page header 'OggS' at each page start", raw: "0x00 'OggS'", type: string, meaning: "page framing magic", example: "OggS", location: front, location_note: "", linking: [none], privacy: false, atlas: "no", verified: memory, source: "raw/w3c.md", cost: first_article}
  - {id: ogg.page.header_type, path: "Ogg page +5 header_type (0x01 continued, 0x02 BOS, 0x04 EOS)", raw: "0x05", type: bits, meaning: "BOS marks the first page of each logical stream; EOS the last", example: "0x02", location: front, location_note: "", linking: [none], privacy: false, atlas: "no", verified: memory, source: "raw/w3c.md", cost: first_article}
  - {id: ogg.page.granule_position, path: "Ogg page +6 granule_position (i64)", raw: "0x06", type: uint, meaning: "sample count so far; on the last page it gives total samples (Opus: 48 kHz count)", example: "", location: tail, location_note: "last page carries the total duration", linking: [same_film], privacy: false, atlas: "no", verified: memory, source: "raw/w3c.md", cost: tail}
  - {id: ogg.page.serial, path: "Ogg page +14 bitstream serial number (u32)", raw: "0x0E", type: uint, meaning: "random per logical stream per mux; byte-identical copies share it (twin)", example: "", location: front, location_note: "", linking: [twin], privacy: false, atlas: "no", verified: memory, source: "raw/w3c.md", cost: first_article}
  - {id: ogg.page.sequence_crc, path: "Ogg page +18 page sequence number (u32) and +22 CRC (u32)", raw: "0x12, 0x16", type: uint, meaning: "page order and checksum; sequence and CRC together identify exact pages", example: "", location: front, location_note: "", linking: [twin], privacy: false, atlas: "no", verified: memory, source: "raw/w3c.md", cost: first_article}
  - {id: ogg.vorbis.identification, path: "Vorbis identification header ('\\x01vorbis')", raw: "first packet of the BOS page", type: binary, meaning: "channels, sample rate, blocksize and bitrate hints", example: "2 ch 44100 Hz", location: front, location_note: "", linking: [none], privacy: false, atlas: "no", verified: memory, source: "raw/w3c.md", cost: first_article}
  - {id: ogg.vorbis.comment, path: "Vorbis comment header ('\\x03vorbis'): vendor string then KEY=VALUE pairs", raw: "packet 2", type: string, meaning: "vendor (encoder build) plus TITLE, ARTIST, ALBUM, DATE, ENCODER, TRACKNUMBER", example: "Xiph.Org libVorbis I 20070622", location: front, location_note: "page 2 or 3", linking: [alt, same_film], privacy: true, atlas: "no", verified: memory, source: "raw/w3c.md", cost: first_article}
  - {id: ogg.opus.head, path: "OpusHead packet: channels, pre-skip (u16 LE at +10), input sample rate (u32 LE at +12), output gain, mapping family", raw: "packet 1", type: binary, meaning: "Opus stream parameters; pre-skip shifts the true duration", example: "pre-skip 312", location: front, location_note: "", linking: [same_film], privacy: false, atlas: "no", verified: memory, source: "raw/w3c.md", cost: first_article}
  - {id: ogg.opus.tags, path: "OpusTags packet: vendor string and Vorbis-style comments", raw: "packet 2", type: string, meaning: "encoder vendor and comments", example: "", location: front, location_note: "", linking: [alt], privacy: true, atlas: "no", verified: memory, source: "raw/w3c.md", cost: first_article}
  - {id: ogg.theora.identification, path: "Theora identification header ('\\x80theora'): frame size, picture size, frame rate numerator and denominator, pixel aspect, colour space", raw: "first packet", type: binary, meaning: "video dimensions and frame rate for Theora streams", example: "", location: front, location_note: "", linking: [same_film], privacy: false, atlas: "no", verified: memory, source: "raw/w3c.md", cost: first_article}
  - {id: ogg.ogm.stream_header, path: "OGM '\\x01video' or '\\x01audio' stream header: subtype FourCC at +8, time_unit (100 ns per frame), dimensions", raw: "BOS packet payload", type: binary, meaning: "OGM video codec FourCC (DIV3, DIVX, XVID, MP42, DX50) and frame timing", example: "time_unit 400000 = 25 fps", location: front, location_note: "layout from memory of the OGM spec", linking: [alt], privacy: false, atlas: "no", verified: memory, source: "raw/w3c.md", cost: first_article}
  - {id: ogg.ogm.comment, path: "OGM '\\x03' comment packet with KEY=VALUE tags", raw: "comment packet", type: string, meaning: "OGM tags, same form as Vorbis comments", example: "", location: front, location_note: "", linking: [alt], privacy: true, atlas: "no", verified: memory, source: "raw/w3c.md", cost: first_article}

flv:
  - {id: flv.header, path: "FLV header: 'FLV' + version 0x01 + flags (0x04 audio, 0x01 video) + u32 data offset (9)", raw: "0x00-0x08", type: binary, meaning: "FLV magic and which tracks exist", example: "audio and video flags set", location: front, location_note: "", linking: [none], privacy: false, atlas: "no", verified: memory, source: "raw/w3c.md", cost: first_article}
  - {id: flv.script_tag_onmetadata, path: "first tag, type 18 (script data): AMF0 'onMetaData' with ECMA array", raw: "tag at offset 13", type: binary, meaning: "the metadata block: all fields below live here", example: "", location: front, location_note: "first tag after 13 bytes", linking: [alt], privacy: false, atlas: "no", verified: memory, source: "raw/w3c.md", cost: first_article}
  - {id: flv.meta.duration_size, path: "onMetaData 'duration' (double, seconds) and 'filesize' (double, bytes)", raw: "AMF0 named properties", type: float, meaning: "runtime and exact file size; duration plus filesize is a same-film key, filesize alone is a twin key", example: "duration 5432.1, filesize 1234567890", location: front, location_note: "", linking: [same_film, twin], privacy: false, atlas: "no", verified: memory, source: "raw/w3c.md", cost: first_article}
  - {id: flv.meta.width_height_framerate, path: "onMetaData 'width', 'height' (double), 'framerate' (double)", raw: "AMF0 named properties", type: uint, meaning: "picture size and frame rate as the muxer wrote them", example: "1280x720 at 23.976", location: front, location_note: "", linking: [same_film], privacy: false, atlas: "no", verified: memory, source: "raw/w3c.md", cost: first_article}
  - {id: flv.meta.codec_ids, path: "onMetaData 'videocodecid' (2 Sorenson H.263, 4 VP6, 7 AVC) and 'audiocodecid' (2 MP3, 10 AAC)", raw: "AMF0 named properties", type: uint, meaning: "codec identity per stream", example: "videocodecid 7", location: front, location_note: "", linking: [none], privacy: false, atlas: "no", verified: memory, source: "raw/w3c.md", cost: first_article}
  - {id: flv.meta.audio_params, path: "onMetaData 'audiosamplerate', 'audiosamplesize', 'audiochannels', 'audiodatarate', 'stereo'", raw: "AMF0 named properties", type: uint, meaning: "audio rate, depth, channels and bitrate as declared", example: "", location: front, location_note: "", linking: [same_film], privacy: false, atlas: "no", verified: memory, source: "raw/w3c.md", cost: first_article}
  - {id: flv.meta.videodatarate, path: "onMetaData 'videodatarate' (kbps)", raw: "AMF0 named property", type: uint, meaning: "declared video bitrate in kbps", example: "2500", location: front, location_note: "", linking: [same_film], privacy: false, atlas: "no", verified: memory, source: "raw/w3c.md", cost: first_article}
  - {id: flv.meta.encoder, path: "onMetaData 'encoder' and 'metadatacreator' (strings)", raw: "AMF0 strings", type: string, meaning: "writer identity, for example 'Lavf57.83.100' or 'Ffmpeg'; encoder plus creator is an alt key", example: "Lavf57.83.100", location: front, location_note: "", linking: [alt, tool], privacy: false, atlas: "no", verified: memory, source: "raw/w3c.md", cost: first_article}
  - {id: flv.meta.lasttimestamp, path: "onMetaData 'lasttimestamp' and 'lastkeyframetime' (double, ms)", raw: "AMF0 named properties", type: float, meaning: "last timestamp of the stream; a cross-check for duration", example: "", location: tail, location_note: "values written at mux end", linking: [same_film], privacy: false, atlas: "no", verified: memory, source: "raw/w3c.md", cost: tail}
  - {id: flv.meta.keyframes, path: "onMetaData 'keyframes' object: filepositions[] and times[] arrays", raw: "AMF0 strict array", type: binary, meaning: "keyframe index for seeking; large on long files and can exceed the first article", example: "", location: front, location_note: "can run past 700 KB on a long film", linking: [none], privacy: false, atlas: "no", verified: memory, source: "raw/w3c.md", cost: first_4mb}

vob_ps:
  - {id: vob.pack_header, path: "MPEG-2 program stream pack header start code 0x000001BA", raw: "0x00-0x0D", type: binary, meaning: "SCR (33 bits base plus 9 extension at 27 MHz) and program_mux_rate (22 bits, 50-byte units)", example: "", location: front, location_note: "one pack about every 2 KB", linking: [none], privacy: false, atlas: "no", verified: memory, source: "raw/w3c.md", cost: first_article}
  - {id: vob.system_header, path: "system header start code 0x000001BB after the first pack", raw: "after the first pack header", type: binary, meaning: "rate_bound, audio_bound, video_bound, fixed and CSPS flags, P-STD buffer size per stream id", example: "", location: front, location_note: "first VOBU", linking: [alt], privacy: false, atlas: "no", verified: memory, source: "raw/w3c.md", cost: first_article}
  - {id: vob.pes.stream_ids, path: "PES stream ids: video 0xE0-0xEF, audio 0xC0-0xDF, private_stream_1 0xBD, private_stream_2 0xBF (nav packs)", raw: "PES start code id byte", type: uint, meaning: "which elementary stream a PES packet carries", example: "0xE0 video, 0xBD AC-3 and subpictures", location: front, location_note: "", linking: [none], privacy: false, atlas: "no", verified: memory, source: "raw/w3c.md", cost: first_article}
  - {id: vob.private_stream_1.sub_id, path: "private_stream_1 first payload byte (sub_stream_id)", raw: "PES payload byte 0 after the header", type: uint, meaning: "0x20-0x3F subpicture, 0x80-0x87 AC-3, 0x88-0x8F DTS, 0xA0-0xA7 LPCM", example: "0x80 = AC-3", location: front, location_note: "", linking: [none], privacy: false, atlas: "no", verified: memory, source: "raw/w3c.md", cost: first_article}
  - {id: vob.nav.pci, path: "private_stream_2 sub_id 0x00: PCI (presentation control information)", raw: "nav pack PCI", type: binary, meaning: "button and highlight info; VOBU start and end presentation time", example: "", location: front, location_note: "one per VOBU", linking: [same_film], privacy: false, atlas: "no", verified: memory, source: "raw/w3c.md", cost: first_article}
  - {id: vob.nav.dsi, path: "private_stream_2 sub_id 0x01: DSI (data search information): NV_PCK_LBN, VOBU end address, navigation links", raw: "nav pack DSI", type: binary, meaning: "VOBU sector addresses and seek links; the DSI sector layout is a rip fingerprint", example: "", location: front, location_note: "one per VOBU", linking: [twin, same_film], privacy: false, atlas: "no", verified: memory, source: "raw/w3c.md", cost: first_article}
  - {id: vob.ifo_sibling, path: "VTS_0n_0.IFO beside VTS_0n_1.VOB (separate file)", raw: "separate IFO", type: binary, meaning: "authoritative title, PGC and stream tables for the VOBs; present in most DVD rips", example: "VTS_01_0.IFO", location: separate_file, location_note: "VIDEO_TS/ folder; one-title samples put it near 0.6 MB", linking: [same_film, same_disc], privacy: false, atlas: "no", verified: tested, source: "raw/w6a.md", cost: targeted}
  - {id: vob.stream.mpeg2_video_pes, path: "MPEG-2 video PES inside VOB: sequence header gives width, height, frame rate and aspect", raw: "video PES payload, start code 0x000001B3", type: binary, meaning: "resolution and frame rate from the stream itself, not the IFO", example: "720x576 25 fps", location: front, location_note: "", linking: [same_film], privacy: false, atlas: "no", verified: memory, source: "raw/w3c.md", cost: first_4mb}
  - {id: vob.stream.ac3_pes, path: "AC-3 audio inside private_stream_1 with sub_id 0x80-0x87 (frame header sync 0x0B77)", raw: "private_stream_1 payload", type: binary, meaning: "AC-3 bitstream: sample rate, channel mode, bitrate from the frame header", example: "48 kHz 2 ch", location: front, location_note: "", linking: [same_film], privacy: false, atlas: "no", verified: memory, source: "raw/w3c.md", cost: first_4mb}
  - {id: vob.stream.lpcm_pes, path: "LPCM audio inside private_stream_1 with sub_id 0xA0-0xA7 (header of 4 bytes before samples)", raw: "private_stream_1 payload", type: binary, meaning: "LPCM bit depth, sample rate and channels from the 4-byte header", example: "", location: front, location_note: "", linking: [same_film], privacy: false, atlas: "no", verified: memory, source: "raw/w3c.md", cost: first_4mb}
  - {id: vob.stream.subpicture_pes, path: "subpicture PES inside private_stream_1 with sub_id 0x20-0x3F", raw: "private_stream_1 payload", type: binary, meaning: "DVD subtitle (RLE bitmap) packets; count gives event count", example: "", location: front, location_note: "", linking: [same_subs], privacy: false, atlas: "no", verified: memory, source: "raw/w3c.md", cost: first_4mb}
  - {id: vob.program_mux_rate, path: "pack header program_mux_rate (22 bits, 50 bytes per second units)", raw: "pack header bits", type: uint, meaning: "declared mux rate; with VOB size gives a rough bitrate", example: "", location: front, location_note: "", linking: [none], privacy: false, atlas: "no", verified: memory, source: "raw/w3c.md", cost: first_article}
  - {id: vob.size_and_cell_span, path: "VOB file size and the VTS PGC cell sector range", raw: "directory record size + IFO cell table", type: uint, meaning: "bitrate estimate (size over playback time) and a same-film check", example: "", location: targeted_fetch, location_note: "size from directory record; cell range from IFO", linking: [same_film], privacy: false, atlas: "no", verified: memory, source: "raw/w3c.md", cost: targeted}

derived:
  - {id: derived.main_title_bd, path: "derived: BD main title from index.bdmv, PLAYLIST/*.mpls and CLIPINF", raw: "n/a", type: string, meaning: "drop playlists under 20 s and any playlist that repeats a clip; take the longest remaining; in a group of playlists sharing clips the longest is the film (decoys share clips)", example: "00800.mpls, 7273.3 s", location: separate_file, location_note: "needs index, all MPLS files and their CLIPINF files; the rules follow a BDInfo port and are not confirmed on a real disc", linking: [same_film], privacy: false, atlas: "no", verified: memory, source: "raw/w4c.md", cost: targeted}
  - {id: derived.main_title_dvd, path: "derived: DVD main title from VTS PGC playback times", raw: "n/a", type: string, meaning: "pick the longest PGC across title sets (VTS IFOs); decoy title sets can be added to a disc", example: "VTS_01 PGC 00:00:30.00 at 25 fps", location: targeted_fetch, location_note: "needs every VTS IFO; the second IFO can be at ~21 MB", linking: [same_film], privacy: false, atlas: "no", verified: memory, source: "raw/w4c.md", cost: targeted}
  - {id: derived.disc_runtime_bd, path: "derived: BD runtime = sum over the main title's play items of (OUT - IN) / 45000", raw: "n/a", type: float, meaning: "exact title runtime in seconds from MPLS only", example: "7273.3", location: separate_file, location_note: "MPLS files only; no CLPI needed", linking: [same_film], privacy: false, atlas: "no", verified: source, source: "raw/w3b.md", cost: targeted}
  - {id: derived.disc_runtime_dvd, path: "derived: DVD runtime = PGC playback time in BCD (sum over cells for cross-check)", raw: "n/a", type: float, meaning: "exact title runtime in seconds from the IFO", example: "30.0", location: targeted_fetch, location_note: "IFO only", linking: [same_film], privacy: false, atlas: "no", verified: tested, source: "raw/w6a.md", cost: targeted}
  - {id: derived.chapter_list_bd, path: "derived: BD chapters = PlayListMark entries of mark_type 1 for the main title, times relative to the play item", raw: "n/a", type: string, meaning: "chapter count and start times", example: "24 chapters", location: separate_file, location_note: "MPLS only; ref_to_play_item maps times to clip timelines", linking: [same_film], privacy: false, atlas: "no", verified: source, source: "raw/w3b.md", cost: targeted}
  - {id: derived.chapter_list_dvd, path: "derived: DVD chapters = PGC programs (PTT entries) with their cell start times", raw: "n/a", type: string, meaning: "chapter count and start times from PGC program map and cell playback", example: "3 chapters at 0, 10, 20 s", location: targeted_fetch, location_note: "IFO only", linking: [same_film], privacy: false, atlas: "no", verified: tested, source: "raw/w6a.md", cost: targeted}
