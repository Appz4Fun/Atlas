  # ---- Void / CRC / misc
  - {id: mkv.void, path: "Void (any parent)", raw: "0xEC", type: binary, meaning: "padding; mkvmerge reserves space here and fills it later; Lavf reserves for SeekHead and Duration", example: "", location: front, location_note: "skip; position tells the writer's layout", linking: [none], privacy: false, atlas: "no", verified: tested, source: "raw/w2a.md", cost: first_article}
  - {id: mkv.crc32, path: "Cluster or Segment child (CRC-32)", raw: "0xBF", type: binary, meaning: "CRC-32 of the parent payload (4 bytes); optional", example: "0x12345678", location: front_or_tail, location_note: "mkvmerge writes it on clusters", linking: [none], privacy: false, atlas: "no", verified: tested, source: "raw/w5b.md", cost: first_4mb}

  # ---- Derived (computed fields; Atlas computes them, not stored in file)
derived:
  - {id: derived.hdr_label, path: "derived from TrackEntry Video Colour, MasteringMetadata, dvcC, hvcC SEI", raw: "n/a", type: string, meaning: "precedence, stop at first match: 1 DV record (BlockAddIDType dvcC/dvvC or dvcC/dvvC in MP4) -> Dolby Vision with profile, level, compat; 2 profile 5 -> 'Dolby Vision Profile 5'; 3 profile 8.1 (compat 1) -> 'DV Profile 8.1, HDR10 compatible'; 4 profile 8.2 (compat 2) -> SDR compatible; 5 profile 8.4 (compat 4) -> HLG compatible; 6 profile 7 -> 'Dolby Vision Profile 7'; 7 HDR10+ (ST 2094-40 T.35 SEI, country B5, provider 003C, code 0001, or BD hdr_plus flag) -> add HDR10+ to base label; 8 transfer 16 with SEI 137 and/or 144 (or MasteringMetadata present) -> HDR10; 9 transfer 16 without static metadata -> 'PQ (HDR, no static metadata)'; 10 transfer 18 -> HLG; 11 transfer 1 or unspecified -> SDR BT.709", example: "HDR10", location: front_or_tail, location_note: "SEI-only HDR10 with no Colour mastering is labelled PQ today (w5a bug); needs first IDR scan", linking: [same_film], privacy: false, atlas: buggy, verified: tested, source: "raw/w6c.md", cost: first_4mb}
  - {id: derived.bit_depth, path: "derived from CodecPrivate config record", raw: "n/a", type: uint, meaning: "bit depth from codec config, not Colour.BitsPerChannel: hvcC byte 17 bits 0-2 (+8) luma and byte 18 bits 0-2 (+8) chroma; avcC bit_depth_luma_minus8 in ext bytes for profiles 100/110/122/144; av1C byte 2 high_bitdepth (bit 6) and twelve_bit (bit 5); vpcC byte 6 high nibble", example: "10", location: front, location_note: "fixes the w5a bit_depth None on 10-bit HEVC", linking: [same_film], privacy: false, atlas: buggy, verified: tested, source: "raw/w6c.md", cost: first_article}
  - {id: derived.duration_seconds, path: "derived from Segment/Info/Duration * TimestampScale / 1e9", raw: "n/a", type: float, meaning: "container duration in seconds; float32 tell gives ms-scale error; true playback length is derived.true_duration", example: "5432.117", location: front, location_note: "Lavf-rewritten duration sits in the front after finalise only if seekable", linking: [alt], privacy: false, atlas: parsed, verified: tested, source: "raw/w5a.md", cost: first_article}
  - {id: derived.true_duration, path: "derived from ordered edition chapters (ChapterTimeStart/End, ChapterSegmentUUID)", raw: "n/a", type: float, meaning: "if EditionFlagOrdered: sum of (ChapterTimeEnd - ChapterTimeStart) over enabled, non-hidden atoms, in playback order; if any atom links to an external segment, mark partial", example: "5432.1", location: front_or_tail, location_note: "only trustworthy when ordered and in-file", linking: [same_film], privacy: false, atlas: "no", verified: memory, source: "raw/w5a.md", cost: first_4mb}
  - {id: derived.edition_selection, path: "derived from EditionEntry flags", raw: "n/a", type: string, meaning: "pick the edition with EditionFlagDefault=1 and EditionFlagHidden=0; else the first non-hidden edition; never the first edition blindly (w5a bug)", example: "edition 2 (default, ordered)", location: front_or_tail, location_note: "", linking: [same_film], privacy: false, atlas: buggy, verified: tested, source: "raw/w5a.md", cost: first_4mb}
  - {id: derived.chapter_skip, path: "derived from ChapterSkipType spans", raw: "n/a", type: string, meaning: "spans typed 1 (opening credits) and 2 (end credits) give skip-intro/skip-outro ranges; a type applies until the next ChapterSkipType atom or ChapterTimeEnd", example: "opening 00:00:00-00:01:30", location: front_or_tail, location_note: "", linking: [same_film], privacy: false, atlas: "no", verified: memory, source: "raw/w5b.md", cost: first_4mb}
  - {id: derived.fps, path: "derived from TrackEntry/DefaultDuration", raw: "n/a", type: float, meaning: "fps = 1e9 / DefaultDuration; absent or wrong for VFR; interlaced needs DefaultDecodedFieldDuration", example: "23.976", location: front, location_note: "", linking: [same_film], privacy: false, atlas: parsed, verified: tested, source: "raw/w5a.md", cost: first_article}
  - {id: derived.resolution, path: "derived from PixelWidth x PixelHeight, crop, DisplayWidth/Height", raw: "n/a", type: string, meaning: "coded = Pixel*; active picture = Pixel* minus Crop*; display (SAR-adjusted) = Display*; cross-check with SPS in hvcC or avcC", example: "1920x1080 (active 1920x800)", location: front, location_note: "", linking: [same_film], privacy: false, atlas: parsed, verified: tested, source: "raw/w5a.md", cost: first_article}
  - {id: derived.bitrate_per_track, path: "derived: Tags BPS, else NUMBER_OF_BYTES*8/DURATION(track), else (file bytes)*8/Duration container estimate", raw: "n/a", type: uint, meaning: "per-track average bits per second; BPS tag if present, then bytes/duration, then container-level estimate (labelled as estimate)", example: "8421000", location: tail, location_note: "tail statistics tags; for MKV without stats, only the estimate from file size", linking: [alt], privacy: false, atlas: "no", verified: tested, source: "raw/w2a.md", cost: tail}
  - {id: derived.frame_count, path: "derived: Tags NUMBER_OF_FRAMES, else count of SimpleBlock/Block per track (full scan)", raw: "n/a", type: uint, meaning: "exact video frame count or subtitle event count; from stats tag (tail) or full block count", example: "63432", location: tail, location_note: "needs tail read or full scan", linking: [alt], privacy: false, atlas: "no", verified: tested, source: "raw/w3a.md", cost: tail}
  - {id: derived.sub_event_count, path: "derived: NUMBER_OF_FRAMES on subtitle track", raw: "n/a", type: uint, meaning: "number of subtitle events (cues) for S_TEXT and S_HDMV tracks where stats exist", example: "812", location: tail, location_note: "", linking: [same_subs], privacy: false, atlas: "no", verified: tested, source: "raw/w3a.md", cost: tail}
  - {id: derived.same_subs_key, path: "derived: sha256(CodecPrivate of S_TEXT/ASS minus the [Aegisub Project Garbage] section)", raw: "n/a", type: binary, meaning: "same-subs key: same header across releases of one translation; garbage section removed so local paths do not enter the key", example: "sha256:7c1e...", location: front, location_note: "CodecPrivate is in the first article", linking: [same_subs], privacy: false, atlas: "no", verified: tested, source: "raw/w3a.md", cost: first_article}
  - {id: derived.font_set_hash, path: "derived: sha256 over sorted sha256(FileData) of .ttf/.otf/.woff attachments (magic-sniffed)", raw: "n/a", type: binary, meaning: "release-group font set fingerprint; same fonts across encodes of one sub", example: "sha256:9a0b...", location: front_or_tail, location_note: "fonts may be MB-scale; needs FileData complete", linking: [same_subs], privacy: false, atlas: "no", verified: tested, source: "raw/w3a.md", cost: first_4mb}
  - {id: derived.cover_hash, path: "derived: sha256(FileData of attachment with JPEG or PNG magic)", raw: "n/a", type: binary, meaning: "cover-art fingerprint; magic bytes, not FileMediaType", example: "sha256:e44f...", location: front, location_note: "", linking: [same_film], privacy: false, atlas: "no", verified: tested, source: "raw/w3a.md", cost: first_4mb}
