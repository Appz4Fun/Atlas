  - {id: mkv.cluster.block_additional, path: "Cluster/BlockGroup/BlockAdditions/BlockMore/BlockAdditional", raw: "0xA5", type: binary, meaning: "side data for a block (alpha, or DV RPU in some remuxes); payload by BlockAddID", example: "", location: front_or_tail, location_note: "", linking: [alt], privacy: false, atlas: "no", verified: spec, source: "raw/w1a.md", cost: first_4mb}
  - {id: mkv.cluster.discard_padding, path: "Cluster/BlockGroup/DiscardPadding", raw: "0x75A2", type: uint, meaning: "signed ns of audio to discard at block end (encoder padding)", example: "0", location: front_or_tail, location_note: "", linking: [alt], privacy: false, atlas: "no", verified: spec, source: "raw/w1a.md", cost: first_4mb}
