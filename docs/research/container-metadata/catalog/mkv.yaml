  - {id: mkv.track.codec_id, path: "Segment/Tracks/TrackEntry/CodecID", raw: "0x86", type: string, meaning: "codec: V_MPEG4/ISO/AVC, V_MPEGH/ISO/HEVC, V_AV1, V_VP9, A_AC3, A_EAC3, A_DTS, A_DTS/HD MA, A_TRUEHD, A_OPUS, A_FLAC, S_TEXT/UTF8, S_TEXT/ASS, S_HDMV/PGS, S_VOBSUB", example: "V_MPEGH/ISO/HEVC", location: front, location_note: "", linking: [same_film], privacy: false, atlas: parsed, verified: tested, source: "raw/w6c.md", cost: first_article}
  - {id: mkv.track.codec_private, path: "Segment/Tracks/TrackEntry/CodecPrivate", raw: "0x63A2", type: binary, meaning: "codec init data: hvcC/avcC/av1C/vpcC config record, ASS header, VobSub idx text, FLAC STREAMINFO, Opus/Vorbis headers; see derived.codec_config.*", example: "hvcC 23 bytes + SPS/PPS/VPS", location: front, location_note: "first article in both mkvmerge and Lavf", linking: [same_film], privacy: false, atlas: "no", verified: tested, source: "raw/w6c.md", cost: first_article}
  - {id: mkv.track.codec_name, path: "Segment/Tracks/TrackEntry/CodecName", raw: "0x258688", type: utf8, meaning: "human-readable codec name", example: "H.265/HEVC", location: front, location_note: "", linking: [none], privacy: false, atlas: "no", verified: spec, source: "raw/w1a.md", cost: first_article}
  - {id: mkv.track.attachment_link, path: "Segment/Tracks/TrackEntry/AttachmentLink", raw: "0x7446", type: uint, meaning: "links track to an attached file (maxver 3); e.g. font for ASS", example: "1", location: front, location_note: "deprecated", linking: [none], privacy: false, atlas: "no", verified: spec, source: "raw/w1a.md", cost: first_article}
