  - {id: mkv.cluster.timestamp, path: Cluster/Timestamp, raw: '0xE7', type: uint, meaning: cluster base time in TimestampScale ticks, example: '0', location: front, location_note: '', linking: [none], privacy: false, atlas: 'no', verified: tested, source: 'raw/w1a.md; corpus:a_hdr10_lavf.mkv,a_hdr10_mkvmerge.mkv,b_multitrack.mkv', cost: first_article}
