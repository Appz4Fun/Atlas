  - {id: mkv.cluster.prev_size, path: "Cluster/PrevSize", raw: "0xAB", type: uint, meaning: "size of previous cluster in bytes (maxver 4)", example: "1101234", location: front, location_note: "", linking: [none], privacy: false, atlas: "no", verified: spec, source: "raw/w1a.md", cost: first_article}
