# Atlas field catalog, part 1: Matroska / WebM (mkv, webm)
# Synthesized 2026-11-02 from raw/w1a.md, w2a, w3a, w4b, w5a, w5b, w6b, w6c and tools/atlas_media_a29ee52.rs (Atlas a29ee52).
# verified: spec = EBML/Matroska spec XML or RFC text; source = FFmpeg or mkvmerge source read; tested = local tool output; memory = unverified.
# atlas: parsed | partial | buggy | no. Entry form is one flow mapping per field (same keys as the schema).
schema_version: 1
container: matroska
fields:
  # ---- EBML header (0x1A45DFA3)
  - {id: mkv.ebml.doctype, path: "EBML/DocType", raw: "0x4282", type: string, meaning: "matroska or webm; only value that tells WebM from MKV", example: "matroska", location: front, location_note: "tiny; identical across files of same DocType", linking: [none], privacy: false, atlas: parsed, verified: spec, source: "raw/w1a.md", cost: first_article}
  - {id: mkv.ebml.doctype_version, path: "EBML/DocTypeVersion", raw: "0x4287", type: uint, meaning: "Matroska schema version the writer used; 4 adds BlockAdditionMapping, Colour, Projection, CodecDelay; 5 adds ChapterSkipType, EditionDisplay", example: "4", location: front, location_note: "mkvmerge and Lavf both write 4", linking: [tool], privacy: false, atlas: "no", verified: spec, source: "raw/w5b.md", cost: first_article}
  - {id: mkv.ebml.doctype_read_version, path: "EBML/DocTypeReadVersion", raw: "0x4285", type: uint, meaning: "minimum schema version a reader must support; reject if above parser max", example: "2", location: front, location_note: "", linking: [none], privacy: false, atlas: "no", verified: memory, source: "raw/w5b.md", cost: first_article}
  - {id: mkv.ebml.version, path: "EBML/EBMLVersion", raw: "0x4286", type: uint, meaning: "EBML version, always 1", example: "1", location: front, location_note: "bytes 1a45dfa3 a3 4286 81 01 seen in test files", linking: [none], privacy: false, atlas: "no", verified: tested, source: "raw/w5b.md", cost: first_article}
  - {id: mkv.ebml.read_version, path: "EBML/EBMLReadVersion", raw: "0x42F7", type: uint, meaning: "minimum EBML version needed to read, always 1", example: "1", location: front, location_note: "", linking: [none], privacy: false, atlas: "no", verified: tested, source: "raw/w5b.md", cost: first_article}
  - {id: mkv.ebml.max_id_length, path: "EBML/EBMLMaxIDLength", raw: "0x42F2", type: uint, meaning: "max EBML ID width; must be 4 for Matroska", example: "4", location: front, location_note: "", linking: [none], privacy: false, atlas: "no", verified: tested, source: "raw/w5b.md", cost: first_article}
  - {id: mkv.ebml.max_size_length, path: "EBML/EBMLMaxSizeLength", raw: "0x42F3", type: uint, meaning: "max VINT size width (1-8); reject wider VINTs", example: "8", location: front, location_note: "", linking: [none], privacy: false, atlas: "no", verified: spec, source: "raw/w5b.md", cost: first_article}
  - {id: mkv.ebml.doctype_extension, path: "EBML/DocTypeExtension", raw: "0x4281", type: master, meaning: "extra doctype declaration (Name 0x4283, Version 0x4284)", example: "", location: front, location_note: "rare", linking: [none], privacy: false, atlas: "no", verified: memory, source: "raw/w1a.md", cost: first_article}

  # ---- Segment and SeekHead
  - {id: mkv.segment, path: Segment, raw: '0x18538067', type: master, meaning: top-level container; size may be UNKNOWN (all VINT bits set), example: '', location: front, location_note: unknown size used by live/libwebm writers; walker must scan to next top-level ID, linking: [none], privacy: false, atlas: parsed, verified: tested, source: 'raw/w5b.md; corpus:a_hdr10_lavf.mkv,a_hdr10_mkvmerge.mkv,b_multitrack.mkv', cost: first_article}
  - {id: mkv.seekhead, path: Segment/SeekHead, raw: '0x114D9B74', type: master, meaning: index of top-level elements (max 2), example: '', location: front, location_note: 'mkvmerge: front, reserved Void then filled at finalise; Lavf: front, rewritten at trailer', linking: [none], privacy: false, atlas: 'no', verified: tested, source: 'raw/w2a.md; corpus:a_hdr10_lavf.mkv,a_hdr10_mkvmerge.mkv,b_multitrack.mkv', cost: first_article}
  - {id: mkv.seekhead.seek, path: Segment/SeekHead/Seek, raw: '0x4DBB', type: master, meaning: one index entry (min 1), example: '', location: front, location_note: '', linking: [none], privacy: false, atlas: 'no', verified: tested, source: 'raw/w2a.md; corpus:a_hdr10_lavf.mkv,a_hdr10_mkvmerge.mkv,b_multitrack.mkv', cost: first_article}
  - {id: mkv.seekhead.seek_id, path: Segment/SeekHead/Seek/SeekID, raw: '0x53AB', type: binary, meaning: '4-byte ID of the target element (e.g. 0x1254C367 = Tags, 0x1C53BB6B = Cues)', example: 1254c367, location: front, location_note: '', linking: [none], privacy: false, atlas: 'no', verified: tested, source: 'raw/w2a.md; corpus:a_hdr10_lavf.mkv,a_hdr10_mkvmerge.mkv,b_multitrack.mkv', cost: first_article}
  - {id: mkv.seekhead.seek_position, path: Segment/SeekHead/Seek/SeekPosition, raw: '0x53AC', type: uint, meaning: offset of target element from Segment data start; the targeted-fetch address for Tags/Cues/Chapters, example: '204932', location: front, location_note: lets Atlas fetch Tags/Cues by range if the article set allows, linking: [alt], privacy: false, atlas: 'no', verified: tested, source: 'raw/w2a.md; corpus:a_hdr10_lavf.mkv,a_hdr10_mkvmerge.mkv,b_multitrack.mkv', cost: first_article}

  # ---- Info
  - {id: mkv.info, path: Segment/Info, raw: '0x1549A966', type: master, meaning: 'segment information; required, once', example: '', location: front, location_note: always before Tracks in mkvmerge and Lavf output, linking: [none], privacy: false, atlas: parsed, verified: tested, source: 'raw/w2a.md; corpus:a_hdr10_lavf.mkv,a_hdr10_mkvmerge.mkv,b_multitrack.mkv', cost: first_article}
  - {id: mkv.info.segment_uuid, path: Segment/Info/SegmentUUID, raw: '0x73A4', type: binary16, meaning: '128-bit unique segment id; regenerated per mux in mkvmerge; absent with no_variable_data. Same UUID = same mux run (twin, or alt when re-RAR''d)', example: 3f2a9c1e0b7d4a56a1c2e3f4a5b6c7d8, location: front, location_note: 'mkvmerge: front; Lavf: front only when not bitexact', linking: [twin, alt], privacy: false, atlas: 'no', verified: tested, source: 'raw/w2a.md; corpus:a_hdr10_lavf.mkv,a_hdr10_mkvmerge.mkv,b_multitrack.mkv', cost: first_article}
  - {id: mkv.info.segment_filename, path: "Segment/Info/SegmentFilename", raw: "0x7384", type: utf8, meaning: "original file name at mux time; may leak uploader's local file name", example: "Film.2001.1080p.BluRay.x264.mkv", location: front, location_note: "written only when set by the muxing tool", linking: [alt], privacy: true, atlas: "no", verified: spec, source: "raw/w5b.md", cost: first_article}
  - {id: mkv.info.prev_uuid, path: "Segment/Info/PrevUUID", raw: "0x3CB923", type: binary16, meaning: "UUID of previous segment in a hard-link chain (multi-part files)", example: "", location: front, location_note: "", linking: [same_film], privacy: false, atlas: "no", verified: spec, source: "raw/w5b.md", cost: first_article}
  - {id: mkv.info.prev_filename, path: "Segment/Info/PrevFilename", raw: "0x3C83AB", type: utf8, meaning: "file name of previous segment in chain", example: "Film.part1.mkv", location: front, location_note: "", linking: [same_film], privacy: false, atlas: "no", verified: spec, source: "raw/w5b.md", cost: first_article}
  - {id: mkv.info.next_uuid, path: "Segment/Info/NextUUID", raw: "0x3EB923", type: binary16, meaning: "UUID of next segment in chain", example: "", location: front, location_note: "", linking: [same_film], privacy: false, atlas: "no", verified: spec, source: "raw/w5b.md", cost: first_article}
  - {id: mkv.info.next_filename, path: "Segment/Info/NextFilename", raw: "0x3E83BB", type: utf8, meaning: "file name of next segment in chain", example: "Film.part2.mkv", location: front, location_note: "", linking: [same_film], privacy: false, atlas: "no", verified: spec, source: "raw/w5b.md", cost: first_article}
  - {id: mkv.info.segment_family, path: "Segment/Info/SegmentFamily", raw: "0x4444", type: binary16, meaning: "shared by all segments of one linked set (CD1/CD2, OP/ED files)", example: "", location: front, location_note: "", linking: [same_film], privacy: false, atlas: "no", verified: spec, source: "raw/w5b.md", cost: first_article}
  - {id: mkv.info.chapter_translate, path: "Segment/Info/ChapterTranslate", raw: "0x6924", type: master, meaning: "maps this segment to a DVD/BD chapter codec segment (ID 0x69A5, Codec 0x69BF, EditionUID 0x69FC)", example: "", location: front, location_note: "rare", linking: [none], privacy: false, atlas: "no", verified: spec, source: "raw/w5b.md", cost: first_article}
  - {id: mkv.info.timestamp_scale, path: Segment/Info/TimestampScale, raw: '0x2AD7B1', type: uint, meaning: nanoseconds per tick; default 1000000 (1 ms), example: '1000000', location: front, location_note: '', linking: [alt], privacy: false, atlas: parsed, verified: tested, source: 'raw/w2a.md; corpus:a_hdr10_lavf.mkv,a_hdr10_mkvmerge.mkv,b_multitrack.mkv', cost: first_article}
  - {id: mkv.info.duration, path: "Segment/Info/Duration", raw: "0x4489", type: float, meaning: "duration in TimestampScale ticks; seconds = Duration * TimestampScale / 1e9", example: "5432.117", location: front, location_note: "Lavf: reserved Void, rewritten in place at trailer if unknown at start; mkvmerge: written at header time", linking: [alt], privacy: false, atlas: parsed, verified: tested, source: "raw/w2a.md", cost: first_article}
  - {id: mkv.info.duration_encoding, path: "Segment/Info/Duration (data length)", raw: "0x4489", type: float, meaning: "tell: data length 4 = float32 (mkvmerge writes float32, ~7 significant digits, ms error on long films); 8 = float64 (Lavf writes float64)", example: "4 bytes (mkvmerge) / 8 bytes (Lavf)", location: front, location_note: "use element size to choose the decoder; Atlas float() already handles both", linking: [tool], privacy: false, atlas: parsed, verified: tested, source: "raw/w2a.md", cost: first_article}
  - {id: mkv.info.date_utc, path: "Segment/Info/DateUTC", raw: "0x4461", type: date, meaning: "mux time, ns since 2001-01-01 UTC; volatile per mux (remux discriminator)", example: "2026-10-30T12:00:00Z", location: front, location_note: "mkvmerge always; Lavf only with creation_time; no_variable_data writes an invalid value", linking: [twin, alt, uploader], privacy: false, atlas: "no", verified: tested, source: "raw/w6b.md", cost: first_article}
  - {id: mkv.info.title, path: "Segment/Info/Title", raw: "0x7BA9", type: utf8, meaning: "movie or episode title as written by the muxer", example: "Test Film (2001)", location: front, location_note: "mkvmerge --title; Lavf title metadata", linking: [alt], privacy: false, atlas: parsed, verified: tested, source: "raw/w5a.md", cost: first_article}
  - {id: mkv.info.muxing_app, path: "Segment/Info/MuxingApp", raw: "0x4D80", type: utf8, meaning: "muxing library string (required)", example: "libebml v1.4.5 + libmatroska v1.7.1", location: front, location_note: "Lavf: 'Lavf60.16.100'; no_variable_data: literal 'no_variable_data'", linking: [tool], privacy: false, atlas: parsed, verified: tested, source: "raw/w2a.md", cost: first_article}
  - {id: mkv.info.writing_app, path: "Segment/Info/WritingApp", raw: "0x5741", type: utf8, meaning: "tool and version that wrote the file (required); repackers often leave default", example: "mkvmerge v82.0 ('I'm The President') 64-bit", location: front, location_note: "Lavf: 'Lavf60.16.100' unless encoding_tool metadata set", linking: [tool], privacy: false, atlas: parsed, verified: tested, source: "raw/w2a.md", cost: first_article}
  - {id: mkv.info.chapter_translate_codec, path: "Segment/Info/ChapterTranslate/ChapterTranslateCodec", raw: "0x69BF", type: uint, meaning: "codec of the translated chapters (0 = Matroska script, 1 = DVD menu)", example: "1", location: front, location_note: "", linking: [none], privacy: false, atlas: "no", verified: spec, source: "raw/w5b.md", cost: first_article}

  # ---- Tracks / TrackEntry
  - {id: mkv.tracks, path: Segment/Tracks, raw: '0x1654AE6B', type: master, meaning: list of TrackEntry elements, example: '', location: front, location_note: always before first Cluster, linking: [none], privacy: false, atlas: parsed, verified: tested, source: 'raw/w2a.md; corpus:a_hdr10_lavf.mkv,a_hdr10_mkvmerge.mkv,b_multitrack.mkv', cost: first_article}
  - {id: mkv.track.entry, path: Segment/Tracks/TrackEntry, raw: '0xAE', type: master, meaning: one track; container for all track fields below, example: '', location: front, location_note: '', linking: [none], privacy: false, atlas: parsed, verified: tested, source: 'raw/w1a.md; corpus:a_hdr10_lavf.mkv,a_hdr10_mkvmerge.mkv,b_multitrack.mkv', cost: first_article}
  - {id: mkv.track.number, path: Segment/Tracks/TrackEntry/TrackNumber, raw: '0xD7', type: uint, meaning: track number used in Block headers (not 0), example: '2', location: front, location_note: '', linking: [alt], privacy: false, atlas: 'no', verified: tested, source: 'raw/w1a.md; corpus:a_hdr10_lavf.mkv,a_hdr10_mkvmerge.mkv,b_multitrack.mkv', cost: first_article}
  - {id: mkv.track.uid, path: "Segment/Tracks/TrackEntry/TrackUID", raw: "0x73C5", type: uint, meaning: "random per mux; target of Tags TagTrackUID", example: "1234567890123456789", location: front, location_note: "stable across mkvmerge remux runs in tests", linking: [none], privacy: false, atlas: "no", verified: tested, source: "raw/w6b.md", cost: first_article}
  - {id: mkv.track.type, path: Segment/Tracks/TrackEntry/TrackType, raw: '0x83', type: uint, meaning: '1 video, 2 audio, 3 complex, 0x10 logo, 0x11 subtitle, 0x12 buttons, 0x20 control', example: '1', location: front, location_note: '', linking: [same_film], privacy: false, atlas: parsed, verified: tested, source: 'raw/w1a.md; corpus:a_hdr10_lavf.mkv,a_hdr10_mkvmerge.mkv,b_multitrack.mkv', cost: first_article}
  - {id: mkv.track.flag_enabled, path: "Segment/Tracks/TrackEntry/FlagEnabled", raw: "0xB9", type: uint, meaning: "track is usable; default 1", example: "1", location: front, location_note: "", linking: [alt], privacy: false, atlas: "no", verified: spec, source: "raw/w1a.md", cost: first_article}
  - {id: mkv.track.flag_default, path: "Segment/Tracks/TrackEntry/FlagDefault", raw: "0x88", type: uint, meaning: "default track for its type; default 1 when absent (absent flag = default)", example: "1", location: front, location_note: "", linking: [alt], privacy: false, atlas: "no", verified: tested, source: "raw/w5a.md", cost: first_article}
  - {id: mkv.track.flag_forced, path: "Segment/Tracks/TrackEntry/FlagForced", raw: "0x55AA", type: uint, meaning: "forced subtitle track (auto-select with audio language)", example: "1", location: front, location_note: "", linking: [same_subs], privacy: false, atlas: parsed, verified: tested, source: "raw/w5a.md", cost: first_article}
  - {id: mkv.track.flag_hearing_impaired, path: "Segment/Tracks/TrackEntry/FlagHearingImpaired", raw: "0x55AB", type: uint, meaning: "SDH subtitles or hearing-impaired track", example: "1", location: front, location_note: "", linking: [same_subs], privacy: false, atlas: parsed, verified: tested, source: "raw/w5a.md", cost: first_article}
  - {id: mkv.track.flag_visual_impaired, path: "Segment/Tracks/TrackEntry/FlagVisualImpaired", raw: "0x55AC", type: uint, meaning: "audio description track for blind/low-vision viewers", example: "1", location: front, location_note: "", linking: [alt], privacy: false, atlas: "no", verified: spec, source: "raw/w5b.md", cost: first_article}
  - {id: mkv.track.flag_text_descriptions, path: "Segment/Tracks/TrackEntry/FlagTextDescriptions", raw: "0x55AD", type: uint, meaning: "text descriptions track (subtitle-type descriptions)", example: "1", location: front, location_note: "", linking: [alt], privacy: false, atlas: "no", verified: spec, source: "raw/w5b.md", cost: first_article}
  - {id: mkv.track.flag_original, path: "Segment/Tracks/TrackEntry/FlagOriginal", raw: "0x55AE", type: uint, meaning: "original-language track; best pick for the main audio", example: "1", location: front, location_note: "", linking: [same_film], privacy: false, atlas: "no", verified: spec, source: "raw/w5b.md", cost: first_article}
  - {id: mkv.track.flag_commentary, path: "Segment/Tracks/TrackEntry/FlagCommentary", raw: "0x55AF", type: uint, meaning: "commentary track", example: "1", location: front, location_note: "mkvmerge --commentary-flag", linking: [alt], privacy: false, atlas: parsed, verified: tested, source: "raw/w5a.md", cost: first_article}
  - {id: mkv.track.flag_lacing, path: Segment/Tracks/TrackEntry/FlagLacing, raw: '0x9C', type: uint, meaning: track may use lacing in Blocks; default 1, example: '1', location: front, location_note: '', linking: [none], privacy: false, atlas: 'no', verified: tested, source: 'raw/w5b.md; corpus:a_hdr10_lavf.mkv,a_hdr10_mkvmerge.mkv,b_multitrack.mkv', cost: first_article}
  - {id: mkv.track.default_duration, path: "Segment/Tracks/TrackEntry/DefaultDuration", raw: "0x23E383", type: uint, meaning: "ns per frame or block; fps = 1e9 / DefaultDuration (23.976 = 41708333)", example: "41708333", location: front, location_note: "absent for VFR or some audio", linking: [same_film], privacy: false, atlas: parsed, verified: tested, source: "raw/w5a.md", cost: first_article}
  - {id: mkv.track.default_decoded_field_duration, path: "Segment/Tracks/TrackEntry/DefaultDecodedFieldDuration", raw: "0x234E7A", type: uint, meaning: "ns per decoded field; interlaced content", example: "20000000", location: front, location_note: "", linking: [same_film], privacy: false, atlas: "no", verified: spec, source: "raw/w5b.md", cost: first_article}
  - {id: mkv.track.timestamp_scale, path: "Segment/Tracks/TrackEntry/TrackTimestampScale", raw: "0x23314F", type: float, meaning: "deprecated per-track timestamp scale (maxver 3); default 1.0", example: "1.0", location: front, location_note: "", linking: [none], privacy: false, atlas: "no", verified: spec, source: "raw/w1a.md", cost: first_article}
  - {id: mkv.track.max_block_addition_id, path: Segment/Tracks/TrackEntry/MaxBlockAdditionID, raw: '0x55EE', type: uint, meaning: highest BlockAddID used on track; 0 = no BlockAdditions, example: '0', location: front, location_note: '', linking: [same_film], privacy: false, atlas: 'no', verified: tested, source: 'raw/w5b.md; corpus:a_hdr10_lavf.mkv,b_truehd.mkv,b_video.mkv', cost: first_article}
  - {id: mkv.track.name, path: "Segment/Tracks/TrackEntry/Name", raw: "0x536E", type: utf8, meaning: "track label, e.g. 'English 5.1', 'Director Commentary', 'SDH', 'Forced'; release-group habit", example: "English 5.1", location: front, location_note: "video track name not surfaced by Atlas", linking: [alt], privacy: false, atlas: partial, verified: tested, source: "raw/w5a.md", cost: first_article}
