  - {id: mkv.track.seek_pre_roll, path: "Segment/Tracks/TrackEntry/SeekPreRoll", raw: "0x56BB", type: uint, meaning: "ns of pre-roll needed before a seek point (Opus/Vorbis)", example: "80000000", location: front, location_note: "", linking: [same_film], privacy: false, atlas: "no", verified: spec, source: "raw/w5b.md", cost: first_article}
  - {id: mkv.track.translate, path: "Segment/Tracks/TrackEntry/TrackTranslate", raw: "0x6624", type: master, meaning: "maps track to a codec-specific ID (DVD/BD); TrackTranslateTrackID 0x66A5, Codec 0x66BF, EditionUID 0x66FC", example: "", location: front, location_note: "rare", linking: [none], privacy: false, atlas: "no", verified: spec, source: "raw/w1a.md", cost: first_article}
  - {id: mkv.track.content_encodings, path: "Segment/Tracks/TrackEntry/ContentEncodings", raw: "0x6D80", type: master, meaning: "per-track frame transforms; header stripping (algo 3) removes a prefix from every frame and CodecPrivate", example: "", location: front, location_note: "Atlas ignores it; a codec parse of stripped frames would fail", linking: [same_film], privacy: false, atlas: "no", verified: spec, source: "raw/w5b.md", cost: first_article}
