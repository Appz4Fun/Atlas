  path: derived from mvhd duration/timescale, tkhd, mdhd, mehd, sidx, moof walk
  raw: n/a
  type: float
  meaning: 'order: mvhd duration if non-zero and not all-ones; else mehd fragment_duration; else sum of sidx durations; else sum of trun durations; else max mdhd duration; playable length subtracts leading empty elst edits'
  example: '5432.117'
  location: front_or_tail
  location_note: moov-at-end needs tail fetch
  linking: [same_film]
  privacy: false
  atlas: partial
  verified: source
  source: raw/w5c.md
  cost: tail
- id: derived.mp4.frame_count
  path: derived from stsz sample_count, else sum of trun sample_count
  raw: n/a
  type: uint
  meaning: exact video frame count; for tx3g subtract filler samples (zero size) to get events
  example: '63432'
  location: front_or_tail
  location_note: 'fragmented: walk moof headers'
  linking: [same_film]
  privacy: false
  atlas: 'no'
  verified: source
  source: raw/w5c.md
  cost: tail
- id: derived.mp4.fps_cfr_vfr
  path: derived from stts deltas and mdhd timescale
  raw: n/a
  type: string
  meaning: 'CFR when one distinct delta: fps = timescale / delta; VFR when several; average fps = frame_count * timescale / duration_ticks'
  example: CFR 23.976
  location: front_or_tail
  location_note: ''
  linking: [same_film]
  privacy: false
  atlas: 'no'
  verified: source
  source: raw/w5c.md
  cost: tail
- id: derived.mp4.avg_bitrate_per_track
  path: 'derived: sum(stsz) * 8 / (mdhd.duration / mdhd.timescale), fallback btrt avgBitrate or esds avgBitrate'
  raw: n/a
  type: uint
  meaning: per-track average bits per second; prefer elst-trimmed duration for playable bitrate
  example: '8421000'
  location: front_or_tail
  location_note: ''
  linking: [same_film]
  privacy: false
  atlas: 'no'
  verified: source
  source: raw/w5c.md
  cost: tail
- id: derived.mp4.max_bitrate_window
  path: 'derived: max over 1 s windows of stsz bytes via stts timing, else btrt maxBitrate'
  raw: n/a
  type: uint
  meaning: peak video bitrate estimate (window size stated)
  example: '25300000'
  location: front_or_tail
  location_note: ''
  linking: [same_film]
  privacy: false
  atlas: 'no'
  verified: memory
  source: raw/w5c.md
  cost: tail
- id: derived.mp4.gop_keyint
  path: derived from stss gaps converted with stts DTS
  raw: n/a
  type: string
  meaning: 'keyframe interval in frames and seconds: min, median, max; absent stss = every frame is sync (intra-only)'
  example: GOP 48 frames (2.0 s)
  location: front_or_tail
  location_note: ''
  linking: [same_film]
  privacy: false
  atlas: 'no'
  verified: source
  source: raw/w5c.md
  cost: tail
- id: derived.mp4.bframe_depth
  path: derived from ctts offsets or cslg greatest minus least delta
  raw: n/a
  type: uint
  meaning: B-frame reorder depth; 0 = no reordering
  example: '2'
  location: front_or_tail
  location_note: ''
  linking: [same_film]
  privacy: false
  atlas: 'no'
  verified: memory
  source: raw/w5c.md
  cost: tail
- id: derived.mp4.aac_priming_offset
  path: derived from elst first non-empty media_time, iTunSMPB, or dOps pre_skip
  raw: n/a
  type: uint
  meaning: encoder delay in samples to trim; 1024 or 2112 typical for AAC, 312 for Opus
  example: '2112'
  location: front_or_tail
  location_note: ''
  linking: [tool]
  privacy: false
  atlas: 'no'
  verified: source
  source: raw/w5c.md
  cost: tail
- id: derived.mp4.chapter_list
  path: derived from udta/chpl (100 ns), else tref chap text track samples
  raw: n/a
  type: string
  meaning: chapter list with start times in seconds and titles; chpl preferred
  example: 0.0 Opening; 600.0 Act two
  location: front_or_tail
  location_note: chpl lives in moov/udta
  linking: [same_film]
  privacy: false
  atlas: 'no'
  verified: source
  source: raw/w5c.md
  cost: tail
- id: derived.mp4.hdr_label
  path: derived from colr nclx transfer, mdcv, clli, dvcC, hvcC SEI 137/144, avcC/av1C/vpcC
  raw: n/a
  type: string
  meaning: 'same precedence as MKV: DV record first; then HDR10+ SEI; HDR10 if PQ with mdcv or clli or SEI 137/144; PQ without static metadata; HLG (18); SDR (1)'
  example: HDR10 (mdcv + clli)
  location: front_or_tail
  location_note: Atlas reads no colr today, so hdr is null on MP4 (w7a)
  linking: [same_film]
  privacy: false
  atlas: 'no'
  verified: tested
  source: raw/w6c.md
  cost: tail
- id: derived.mp4.dv_summary
  path: derived from dvcC/dvvC/dvwC record
  raw: n/a
  type: string
  meaning: DV profile, level, EL and BL presence, compat id as one string; dvh1 or dvhe without box = DV unknown, not DV absent
  example: DV 8.1 level 6, HDR10 compatible, no EL
  location: front_or_tail
  location_note: ''
  linking: [same_film]
  privacy: false
  atlas: partial
  verified: tested
  source: raw/w7a.md
  cost: tail
- id: derived.mp4.bit_depth
  path: derived from hvcC bytes 17/18, avcC ext, av1C byte 2, vpcC byte 6
  raw: n/a
  type: uint
  meaning: bit depth from codec config records; the stsd depth field is not bit depth
  example: '10'
  location: front_or_tail
  location_note: fixes Atlas bit_depth None on MP4
  linking: [same_film]
  privacy: false
  atlas: 'no'
  verified: tested
  source: raw/w6c.md
  cost: tail
- id: derived.mp4.sample_rate_true
  path: derived from dfLa STREAMINFO, dOps input rate, esds SBR extension, v1/v2 sound entry
  raw: n/a
  type: uint
  meaning: true output sample rate; 16-bit stsd field is wrong above 65535 Hz
  example: '96000'
  location: front_or_tail
  location_note: ''
  linking: [same_film]
  privacy: false
  atlas: 'no'
  verified: spec
  source: raw/w1b.md
  cost: tail
- id: derived.mp4.audio_channel_layout
  path: derived from dac3 acmod/lfeon, dec3 JOC and substreams, ddts ChannelLayout, chnl, dmlp CA1/CA2
  raw: n/a
  type: string
  meaning: speaker layout and Atmos flag from the codec box, not from the stsd channelcount
  example: 5.1 (dec3 JOC)
  location: front_or_tail
  location_note: ''
  linking: [same_film]
  privacy: false
  atlas: partial
  verified: source
  source: raw/w5c.md
  cost: tail
- id: derived.mp4.faststart
  path: derived from top-level box order (moov before mdat)
  raw: n/a
  type: bool
  meaning: true = metadata in the first article; false = needs tail fetch from the mdat end
  example: 'true'
  location: front
  location_note: decides the fetch plan
  linking: [tool]
  privacy: false
  atlas: 'no'
  verified: tested
  source: raw/w2b.md
  cost: first_article
- id: derived.mp4.tail_fetch_plan
  path: 'derived: moov_off = mdat_off + mdat_size (skip free/skip/wide); read moov size, fetch until satisfied; map offset to RAR volume and yEnc part'
  raw: n/a
  type: string
  meaning: 'how to reach moov when it is at the end: header math, then article range; size 0 mdat = no moov'
  example: moov at 1.2 GB, 96 KB, 2 articles
  location: tail
  location_note: ''
  linking: [none]
  privacy: false
  atlas: 'no'
  verified: tested
  source: raw/w2b.md
  cost: tail
- id: derived.mp4.alt_key
  path: 'derived: sha256(codec config records) + first video sample payload + first 8 video + first 16 audio payloads'
  raw: n/a
  type: binary
  meaning: 'remux-stable key: all remux variants kept payloads byte-identical; avcC equals MKV CodecPrivate; needs stco/stsz to find payloads'
  example: sha256:91ab...
  location: tail
  location_note: about 200 KB at 1080p; needs moov then targeted payload reads
  linking: [alt]
  privacy: false
  atlas: 'no'
  verified: tested
  source: raw/w6c.md
  cost: targeted
- id: derived.mp4.muxer_fingerprint
  path: 'derived: ftyp major+compat, hdlr names, ©too, compressorname, mvhd timescale, meta key order'
  raw: n/a
  type: string
  meaning: muxer signature for matching releases from the same tool chain
  example: isom + VideoHandler + Lavf60 + 1000
  location: front_or_tail
  location_note: ''
  linking: [tool]
  privacy: false
  atlas: 'no'
  verified: tested
  source: raw/w2b.md
  cost: tail
- id: derived.mp4.creation_time_state
  path: derived from mvhd creation_time == 0
  raw: n/a
  type: string
  meaning: unset (muxer default, 0) vs set (value present); a set value is user or tool metadata
  example: unset
  location: front_or_tail
  location_note: ''
  linking: [twin]
  privacy: false
  atlas: 'no'
  verified: tested
  source: raw/w2b.md
  cost: tail
- id: derived.mp4.encrypted_flag
  path: 'derived: sinf present in any stsd entry, or pssh in moov'
  raw: n/a
  type: bool
  meaning: DRM-protected copy (streaming rip or leftover); sinf/frma gives the original codec
  example: 'true'
  location: front_or_tail
  location_note: ''
  linking: [none]
  privacy: false
  atlas: 'no'
  verified: spec
  source: raw/w2b.md
  cost: tail
