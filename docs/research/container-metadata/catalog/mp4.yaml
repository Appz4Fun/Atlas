# Atlas field catalog, part 2: MP4 / MOV / M4V (ISO BMFF), including fragmented MP4
# Synthesized 2026-11-02 from raw/w1b.md, w2b.md, w3a.md, w4b.md, w5c.md, w6c.md, w7a.md and tools/atlas_media_a29ee52.rs (Atlas a29ee52).
# verified: spec = ISO/IEC 14496-12/-14/-15 or Apple QTFF as recalled in raw notes (not re-read); source = FFmpeg or mutagen source read; tested = local ffmpeg 6.1.1 / mkvmerge output; memory = unverified.
# atlas: parsed | partial | buggy | no. Atlas today reads only moov (mvhd duration, trak hdlr/mdhd language/stsd fourcc, video w/h + dvcC/dvvC, audio channels/rate, subtitle tracks); no ftyp, no tail fetch.
# location: front_or_tail for anything inside moov (front when faststart, else after mdat). cost: tail for moov fields because ffmpeg default is moov-at-end.
schema_version: 1
container: mp4
fields:
- id: mp4.ftyp.major_brand
  path: ftyp/major_brand
  raw: ftyp +8 fourcc
  type: fourcc
  meaning: 'major brand: isom, iso2, iso5 (fragmented), mp41, mp42, M4V , qt  , dash, msdh'
  example: isom
  location: front
  location_note: first box in every file
  linking: [alt]
  privacy: false
  atlas: 'no'
  verified: tested
  source: raw/w2b.md; corpus:a_aac.m4a,c_mp4_faststart.mp4,c_mp4_nofaststart.mp4
  cost: first_article
- id: mp4.ftyp.minor_version
  path: ftyp/minor_version
  raw: ftyp +12 u32
  type: uint
  meaning: minor version; ffmpeg writes 0x200
  example: '512'
  location: front
  location_note: ''
  linking: [tool]
  privacy: false
  atlas: 'no'
  verified: tested
  source: raw/w2b.md; corpus:a_aac.m4a,c_mp4_faststart.mp4,c_mp4_nofaststart.mp4
  cost: first_article
- id: mp4.ftyp.compatible_brands
  path: ftyp/compatible_brands[]
  raw: ftyp +16.. fourcc list
  type: fourcc_list
  meaning: brand set; muxer and profile hints (isom iso2 avc1 mp41; iso5 iso6 mp41 for fragments; hvc1, qt)
  example: isom iso2 avc1 mp41
  location: front
  location_note: ''
  linking: [alt]
  privacy: false
  atlas: 'no'
  verified: tested
  source: raw/w2b.md; corpus:a_aac.m4a,c_mp4_faststart.mp4,c_mp4_nofaststart.mp4
  cost: first_article
- id: mp4.ftyp.brand_dby1
  path: ftyp/compatible_brands contains dby1
  raw: ftyp compat list fourcc dby1
  type: bool
  meaning: Dolby Vision marker brand; a hint only, the dvcC/dvvC box is the authority
  example: 'true'
  location: front
  location_note: ''
  linking: [same_film]
  privacy: false
  atlas: 'no'
  verified: tested
  source: raw/w1b.md; corpus:a_aac.m4a,c_mp4_faststart.mp4,c_mp4_nofaststart.mp4
  cost: first_article
- id: mp4.box.largesize
  path: any box header
  raw: box size field == 1, u64 at +8
  type: uint
  meaning: 64-bit box size; header becomes 16 bytes; used by mdat and moov in files over 4 GiB
  example: '5368709120'
  location: front_or_tail
  location_note: ''
  linking: [none]
  privacy: false
  atlas: parsed
  verified: source
  source: tools/atlas_media_a29ee52.rs
  cost: first_article
- id: mp4.box.size_zero
  path: any box header
  raw: box size field == 0
  type: bool
  meaning: box runs to EOF; legal only for the last box; an mdat of size 0 at EOF means no moov follows (truncated or stream write)
  example: 'true'
  location: front
  location_note: ''
  linking: [none]
  privacy: false
  atlas: parsed
  verified: source
  source: tools/atlas_media_a29ee52.rs
  cost: first_article
- id: mp4.top.free_skip_wide
  path: top-level free / skip / wide
  raw: 4cc at box offset +4
  type: string
  meaning: padding boxes; ffmpeg writes free at offset 32 before mdat; MP4Box -moovpad pads after moov; skip when walking
  example: free
  location: front
  location_note: ''
  linking: [tool]
  privacy: false
  atlas: 'no'
  verified: memory
  source: raw/w2b.md
  cost: first_article
- id: mp4.top.mdat_size
  path: mdat
  raw: mdat box header size (u32 or largesize)
  type: uint
  meaning: payload size of media data; moov offset in moov-at-end files = mdat_offset + mdat_size
  example: '28883'
  location: front
  location_note: in first article even when moov is at the end
  linking: [none]
  privacy: false
  atlas: 'no'
  verified: tested
  source: raw/w2b.md; corpus:a_aac.m4a,c_mp4_faststart.mp4,c_mp4_nofaststart.mp4
  cost: first_article
- id: mp4.top.box_order
  path: top-level box sequence
  raw: 4cc list of top-level boxes
  type: string
  meaning: ftyp, [free], mdat, moov = ffmpeg default (moov at end); ftyp, moov, free, mdat = faststart or MP4Box; moov, mdat, mfra = fragmented
  example: ftyp free mdat moov
  location: front_or_tail
  location_note: order decides whether metadata is in article 1
  linking: [tool]
  privacy: false
  atlas: 'no'
  verified: tested
  source: raw/w2b.md
  cost: first_article
- id: mp4.top.sidx
  path: sidx
  raw: top-level sidx 4cc
  type: bool
  meaning: segment index box; per-segment duration and byte size for DASH/CMAF; ffmpeg frag mode did not write one
  example: 'true'
  location: front_or_tail
  location_note: ''
  linking: [tool]
  privacy: false
  atlas: 'no'
  verified: memory
  source: raw/w2b.md
  cost: first_article
- id: mp4.top.mfra_mfro
  path: mfra/mfro
  raw: 'last 16 bytes of file: mfro size u32 at -4'
  type: uint
  meaning: size of mfra index at end; gives the tail offset of tfra random-access index
  example: 1 25 (bytes)
  location: tail
  location_note: fragmented files only
  linking: [none]
  privacy: false
  atlas: 'no'
  verified: tested
  source: raw/w2b.md; corpus:w10_frag_dualaudio.mp4,w10_frag_hevc.mp4
  cost: tail
