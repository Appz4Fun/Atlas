[package]
name = "sealed-log"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "Append-only store for Atlas's sealed articles, kept on a big disk"
license = "GPL-3.0-only"

[lib]
path = "src/lib.rs"

[[bin]]
name = "sealed-log"
path = "src/main.rs"

[dependencies]
crc32fast = "1"
libc = "0.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"

[profile.release]
lto = "thin"
