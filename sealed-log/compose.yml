# On the machine with the big disk:  docker compose up -d --build
services:
  sealed-log:
    build: .
    container_name: atlas-sealed-log
    restart: unless-stopped
    # no NAT in the way of a lot of traffic, and the port is the host's
    network_mode: host
    volumes:
      # a bind mount: nothing goes through the overlay filesystem
      - ${SEALED_LOG_DATA:-/mnt/20tb/atlas/data}:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    # time for the last group commit
    stop_grace_period: 30s
    # the kernel's page cache does the caching; this only holds requests
    mem_limit: 2g
    logging:
      driver: local
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/7711"]
      interval: 30s
      timeout: 5s
